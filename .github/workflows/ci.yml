name: CI

# PR 的质量闸门；release.yml 对发布候选提交复用同一组作业：
#   - docs-sync：组件文档、Skill 与引用一致性
#   - package-consumption：NuGet 包内容与隔离消费，独立必过
#   - framework-pack：当前候选只打包一次，以不可变 artifact 供消费与分片下载
#   - framework-pack / template-slices：按档位读出具名分片（每片验证什么见
#     scripts/template-matrix-scenarios.ps1 的 $MatrixSlices），每片一个作业，消费同一候选包；
#     PR 跑 pr 档子集，release 复用与手动触发默认跑 full 全集
#   - template-matrix：保留必过检查名，核对范围、静态及所有必要动态作业和场景回执
#   - test：框架单元测试（含真实 Redis 的分布式锁契约）
#   - postgresql-e2e：模板在真实 PostgreSQL 上的迁移与租户隔离
#   - oidc-e2e：四服务真实 OIDC、委托边界与远端令牌校验
on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      tier:
        description: 模板场景档位
        type: choice
        options: [full, pr]
        default: full
  workflow_call:
    inputs:
      candidate_sha:
        required: true
        type: string
      tier:
        type: string
        default: full

# PR 只跑 pr 档：它能否代表全集由 check-template-scenario-coverage.py 逐行判定，
# 全集在 develop/main 推送、夜间与发布时由 release.yml 复用本工作流执行。
env:
  MATRIX_TIER: ${{ github.event_name == 'pull_request' && !inputs.candidate_sha && 'pr' || inputs.tier || 'full' }}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs-sync:
    name: 文档与 Skill 同步闸门
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装 Skill 校验依赖
        run: python -m pip install PyYAML==6.0.2
      # 闸门清单的唯一来源是 check-all.ps1；新增闸门只改那一处，本文件不必跟着改
      - name: 全部静态闸门
        shell: pwsh
        run: pwsh scripts/check-all.ps1

  template-slices:
    name: 模板场景 · ${{ matrix.slice.title }}
    needs: framework-pack
    if: needs.framework-pack.outputs.docs_only == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        slice: ${{ fromJSON(needs.framework-pack.outputs.slices) }}
    outputs:
      container_needed: ${{ steps.container_scope.outputs.needed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          fetch-depth: 0
      - name: 安装 .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            template/frontend/package-lock.json
            template/.template.config/localization/frontend/package-lock.json
      # 前端单测跑在 Playwright 的 Chromium 里；版本取模板锁文件，与生成项目实际安装的一致
      - name: 安装单测用的 Chromium
        if: fromJSON(needs.framework-pack.outputs.validation_plan).Mode != 'backend'
        shell: pwsh
        run: |
          # 锁文件根包的键是空字符串，ConvertFrom-Json 须用 -AsHashTable 才能解析
          $version = (Get-Content template/frontend/package-lock.json -Raw | ConvertFrom-Json -AsHashTable).packages['node_modules/playwright'].version
          if (-not $version) { throw '模板锁文件里没有 playwright' }
          npx --yes "playwright@$version" install --with-deps chromium
      - name: 下载同一候选 Framework 包
        uses: actions/download-artifact@v4
        with:
          name: candidate-framework-feed
          path: .tmp/local-feed
      - name: 判断是否需要容器验证
        id: container_scope
        shell: pwsh
        run: |
          # PR 用完整 base→head 差异；发布候选用完整 main 差异，无法确定时保守验证。
          $base = '${{ github.event.pull_request.base.sha }}'
          if ($base -notmatch '^[0-9a-f]{40}$') {
            $base = git merge-base origin/main HEAD 2>$null
          }
          $hasBase = $base -match '^[0-9a-f]{40}$'
          if ($hasBase -and $base -eq (git rev-parse HEAD)) { $hasBase = $false }
          if ($hasBase) {
            git cat-file -e "$base^{commit}" 2>$null
            $hasBase = $LASTEXITCODE -eq 0
          }
          $global:LASTEXITCODE = 0
          $changed = if ($hasBase) { @(git diff --no-renames --name-only $base HEAD) } else { @('template/Dockerfile') }
          if ($LASTEXITCODE -ne 0) { throw '无法确定容器验证的变更范围' }
          $needed = @($changed | Where-Object {
            $_ -match '^template/(Dockerfile|\.dockerignore)$' -or
            $_ -match '^template/deploy/' -or
            $_ -eq 'template/.template.config/template.json' -or
            $_ -match '^template/(frontend|\.template\.config/localization/frontend)/(package(-lock)?\.json|angular\.json)$'
          }).Count -gt 0
          "needed=$($needed ? 'true' : 'false')" | Out-File $env:GITHUB_OUTPUT -Append
      - name: 生成并验证本片全部场景
        id: matrix
        shell: pwsh
        env:
          VALIDATION_PLAN: ${{ needs.framework-pack.outputs.validation_plan }}
        run: |
          $env:VALIDATION_PLAN | Set-Content .tmp/quality-plan.json -Encoding utf8
          # @(...) 包住整个 if：单元素数组经 if 输出会展开成字符串，@ 展开字符串会把它拆成单个字符
          $containerArgs = @(if ('${{ steps.container_scope.outputs.needed }}' -eq 'true') { '-ContainerSmoke' })
          # 同候选源码预检由 docs-sync 承担；汇总必须核对其成功，不能用跳过代替通过。
          pwsh scripts/test-template-matrix.ps1 -SkipPack -SkipSourcePreflight -ValidationPlanPath .tmp/quality-plan.json -Tier $env:MATRIX_TIER -Slice '${{ matrix.slice.key }}' @containerArgs
          if ($LASTEXITCODE -ne 0) { throw '模板矩阵失败' }
      - name: 保留完整场景结果
        uses: actions/upload-artifact@v4
        with:
          name: template-matrix-${{ matrix.slice.key }}
          overwrite: true
          path: ${{ steps.matrix.outputs.results_path }}
          if-no-files-found: error

  framework-pack:
    name: 打包候选 Framework
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
      validation_plan: ${{ steps.plan.outputs.validation_plan }}
      slices: ${{ steps.plan.outputs.slices }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          fetch-depth: 2
      - name: 判断是否仅修改内部文档
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          python3 - <<'PY_SCOPE'
          import os, re, subprocess
          from pathlib import Path
          # 白名单唯一来源。只有直接 PR 可以省略动态作业；复用可能继承 PR 事件名。
          docs_only = False
          base = os.environ.get('PR_BASE_SHA', '')
          def git(*args):
              return subprocess.check_output(['git', *args], text=True, encoding='utf-8', stderr=subprocess.PIPE).rstrip('\n')
          try:
              if (os.environ.get('EVENT_NAME') == 'pull_request' and not os.environ.get('CANDIDATE_SHA') and
                  re.fullmatch('[0-9a-f]{40}', base) and base != '0' * 40 and base != git('rev-parse', 'HEAD')):
                  try:
                      git('cat-file', '-e', base + '^{commit}')
                  except subprocess.CalledProcessError:
                      git('fetch', '--no-tags', '--depth=1', 'origin', base)
                  # 禁止 rename 检测：跨白名单边界移动时，两端都必须计入。
                  changed = git('-c', 'core.quotePath=false', 'diff', '--no-renames', '--name-only', '-z', base, 'HEAD').split('\0')[:-1]
                  docs_only = bool(changed) and all(path == 'README.md' or re.match(r'^(docs|\.agents|skills)/', path) for path in changed)
          except (subprocess.CalledProcessError, OSError, UnicodeError):
              docs_only = False  # 无法确定基准或差异时保守全量，不污染步骤退出码。
          result = 'docs_only=' + str(docs_only).lower()
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as output:
              output.write(result + '\n')
          print(result)
          PY_SCOPE
      - name: 生成同候选验证计划
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: python3 scripts/plan-quality-checks.py --tier "$MATRIX_TIER" --docs-only '${{ steps.scope.outputs.docs_only }}' --output .tmp/quality-plan.json --github-output
      - uses: actions/setup-dotnet@v4
        if: steps.scope.outputs.docs_only == 'false'
        with:
          dotnet-version: '10.0.x'
      - name: 打包当前 Framework
        if: steps.scope.outputs.docs_only == 'false'
        shell: pwsh
        run: pwsh framework/build/pack-local-feed.ps1
      - name: 保留同一候选包源
        if: steps.scope.outputs.docs_only == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: candidate-framework-feed
          overwrite: true
          path: .tmp/local-feed/*.nupkg
          if-no-files-found: error

  package-consumption:
    name: NuGet 包内容与隔离消费
    needs: framework-pack
    if: needs.framework-pack.outputs.docs_only == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: 下载同一候选 Framework 包
        uses: actions/download-artifact@v4
        with:
          name: candidate-framework-feed
          path: .tmp/local-feed
      - name: 核对全部包并消费影响闭包
        shell: pwsh
        env:
          VALIDATION_PLAN: ${{ needs.framework-pack.outputs.validation_plan }}
        run: |
          $env:VALIDATION_PLAN | Set-Content .tmp/quality-plan.json -Encoding utf8
          pwsh framework/build/test-package-consumption.ps1 -ValidationPlanPath .tmp/quality-plan.json
          if ($LASTEXITCODE -ne 0) { throw 'NuGet 包消费失败' }

  template-matrix:
    name: 模板全场景矩阵
    runs-on: ubuntu-latest
    needs: [docs-sync, framework-pack, test, template-slices, package-consumption, postgresql-e2e, oidc-e2e]
    if: always()
    timeout-minutes: 5
    steps:
      - name: 检查必要作业全部成功
        id: quality
        shell: pwsh
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha || github.sha }}
        run: |
          $jobs = ConvertFrom-Json $env:NEEDS_JSON -AsHashtable
          foreach ($required in @('framework-pack', 'docs-sync')) {
            if ($jobs[$required].result -cne 'success') {
              throw "$required 失败、缺失、跳过或取消"
            }
          }
          $docsOnly = $jobs['framework-pack'].outputs.docs_only
          if ($docsOnly -cnotin @('true', 'false')) { throw '缺少合法验证范围输出' }
          $expected = if ($docsOnly -ceq 'true') { 'skipped' } else { 'success' }
          foreach ($required in @('template-slices', 'package-consumption', 'postgresql-e2e', 'oidc-e2e')) {
            if ($jobs[$required].result -cne $expected) {
              throw "$required 应为 $expected，实际失败、缺失、取消或范围不一致"
            }
          }
          $plan = $jobs['framework-pack'].outputs.validation_plan | ConvertFrom-Json
          if ($plan.Version -ne 1 -or $plan.DocsOnly -isnot [bool] -or
              $plan.DocsOnly -ne ($docsOnly -ceq 'true') -or $plan.FrameworkTests -isnot [bool] -or
              $plan.Mode -cnotin @('full', 'frontend', 'backend') -or
              $plan.CandidateSha -cnotmatch '^[0-9a-f]{40}$' -or
              $plan.CandidateSha -cne $env:CANDIDATE_SHA -or $plan.Tier -cne $env:MATRIX_TIER -or
              ($docsOnly -ceq 'true' -and ($plan.FrameworkTests -or @($plan.Scenarios).Count -ne 0)) -or
              ($docsOnly -ceq 'false' -and @($plan.Scenarios).Count -eq 0)) { throw '缺少合法同候选验证计划' }
          $frameworkExpected = if ($docsOnly -ceq 'false' -and $plan.FrameworkTests) { 'success' } else { 'skipped' }
          if ($jobs['test'].result -cne $frameworkExpected) { throw '框架测试失败、缺失、取消或范围不一致' }
          "dynamic=$($docsOnly -ceq 'false' ? 'true' : 'false')" | Out-File $env:GITHUB_OUTPUT -Append
          if ($docsOnly -ceq 'true') {
            '仅修改内部文档：完整静态闸门通过，动态验证不适用。' | Out-File $env:GITHUB_STEP_SUMMARY -Append
          }
      - uses: actions/checkout@v4
        if: steps.quality.outputs.dynamic == 'true'
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
      - uses: actions/download-artifact@v4
        if: steps.quality.outputs.dynamic == 'true'
        with:
          pattern: template-matrix-*
          path: .tmp/matrix-receipts
          merge-multiple: true
      - name: 核对预期场景、阶段和候选身份
        if: steps.quality.outputs.dynamic == 'true'
        shell: pwsh
        env:
          CONTAINER_NEEDED: ${{ needs.template-slices.outputs.container_needed }}
          VALIDATION_PLAN: ${{ needs.framework-pack.outputs.validation_plan }}
        run: |
          $env:VALIDATION_PLAN | Set-Content .tmp/quality-plan.json -Encoding utf8
          if ($env:CONTAINER_NEEDED -notin @('true', 'false')) { throw '缺少容器范围判定结果' }
          $containerArgs = @(if ($env:CONTAINER_NEEDED -eq 'true') { '-ContainerSmoke' })
          pwsh scripts/check-template-matrix-results.ps1 -ResultsPath .tmp/matrix-receipts -ValidationPlanPath .tmp/quality-plan.json -Tier $env:MATRIX_TIER @containerArgs
          if ($LASTEXITCODE -ne 0) { throw '模板矩阵证明不完整' }

  test:
    name: 框架单元测试
    needs: framework-pack
    if: needs.framework-pack.outputs.docs_only == 'false' && fromJSON(needs.framework-pack.outputs.validation_plan).FrameworkTests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 分布式锁的 Redis 契约用例需要真实服务：没有服务时它们会跳过而不是失败
    # （提交前自检必须在没装 Redis 的机器上也全绿），因此这里显式提供并在下面 ping 一次
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
      - name: 安装 .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: 还原
        run: dotnet restore framework/Leistd.Framework.slnx
      - name: 构建
        run: dotnet build framework/Leistd.Framework.slnx -c Release --no-restore
      # 不收集覆盖率：此前收集 23 份 cobertura 却没有任何下游步骤消费，
      # 产物直接丢弃，只留下"我们在度量覆盖率"的假信号。
      # 覆盖率定位为按需体检，命令见 framework/build/coverage.runsettings
      # 跳过是本地的让步，不是 CI 的。少了 Redis 服务时这一步直接红，
      # 而不是让锁的契约用例悄无声息地跳过去
      - name: 确认 Redis 可用
        run: |
          docker run --rm --network host redis:7-alpine \
            redis-cli -h 127.0.0.1 -p 6379 ping | grep -q PONG
      - name: 测试
        run: dotnet test framework/Leistd.Framework.slnx -c Release --no-build

  postgresql-e2e:
    name: 模板 PostgreSQL 端到端
    needs: framework-pack
    if: needs.framework-pack.outputs.docs_only == 'false'
    runs-on: ubuntu-latest
    # 复用候选包；各作业的数据库、hive 与解包缓存仍各自隔离。
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
      - name: 安装 .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # 矩阵的集成测试与冒烟各自只用一个库，验不到多库拆分、共享与专属租户库的物理隔离、
      # DbMigrator 命令行与跨进程密钥环这几类"不报错只给错结果"的失效。
      - name: 下载同一候选 Framework 包
        uses: actions/download-artifact@v4
        with:
          name: candidate-framework-feed
          path: .tmp/local-feed
      # 脚本仍可独立运行并打包；CI 只读同候选包，容器与清理由脚本负责。
      - name: 生成 + 迁移 + 真实库隔离验证
        shell: pwsh
        run: pwsh scripts/test-template-postgresql-e2e.ps1 -SkipPack

  oidc-e2e:
    name: 模板 OIDC 跨服务端到端
    needs: framework-pack
    if: needs.framework-pack.outputs.docs_only == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
      - name: 安装 .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: 下载同一候选 Framework 包
        uses: actions/download-artifact@v4
        with:
          name: candidate-framework-feed
          path: .tmp/local-feed
      # 同候选包只读复用；四个真实 API、PostgreSQL、hive 与 finally 清理仍独立。
      # PR 档不等令牌真实到期：S7 只验即时撤销与到期前窗口，交换令牌到期跳过。
      # full 档传 -IncludeExpiryWait，以快速档（访问令牌 90 秒）补跑两条真实到期边界。
      - name: 生成 + OIDC HTTP S2–S8 与 S10
        shell: pwsh
        run: |
          $expiry = @(if ($env:MATRIX_TIER -eq 'full') { '-IncludeExpiryWait' })
          pwsh scripts/test-template-oidc-e2e.ps1 -SkipPack @expiry
      - name: 保留 OIDC 诊断证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oidc-e2e-logs
          # 只上传日志和脱敏断言，生成项目、密钥与 NuGet 缓存不上传。
          path: |
            .tmp/oidc-e2e/**/*.log
            .tmp/oidc-e2e/**/assertions.jsonl
            .tmp/oidc-e2e/**/results.json
            .tmp/oidc-e2e/**/topology.json
            .tmp/oidc-e2e/**/cleanup.json
