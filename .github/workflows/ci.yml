name: CI

# PR 的质量闸门；release.yml 对发布候选提交复用同一组作业：
#   - docs-sync：组件文档、Skill 与引用一致性
#   - template-matrix：打包当前框架并验证全部条件场景的生成、运行与前后端构建
#   - test：框架单元测试（含真实 Redis 的分布式锁契约）
#   - postgresql-e2e：模板在真实 PostgreSQL 上的迁移与租户隔离
on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  workflow_call:
    inputs:
      candidate_sha:
        required: true
        type: string

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs-sync:
    name: 文档与 Skill 同步闸门
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装 Skill 校验依赖
        run: python -m pip install PyYAML==6.0.2
      # 闸门清单的唯一来源是 check-all.ps1；新增闸门只改那一处，本文件不必跟着改
      - name: 全部静态闸门
        shell: pwsh
        run: pwsh scripts/check-all.ps1

  template-matrix:
    name: 模板全场景矩阵
    runs-on: ubuntu-latest
    # 本地实测 8 分钟；矩阵里 Angular healthcheck 的交互提示与单测浏览器都有挂死先例，
    # 没有上限时一次卡死按默认 360 分钟计费并堵住队列
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          fetch-depth: 0
      - name: 安装 .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: template/frontend/package-lock.json
      # 前端单测跑在 Playwright 的 Chromium 里；版本取模板锁文件，与生成项目实际安装的一致
      - name: 安装单测用的 Chromium
        shell: pwsh
        run: |
          $version = (Get-Content template/frontend/package-lock.json -Raw | ConvertFrom-Json).packages.'node_modules/playwright'.version
          if (-not $version) { throw '模板锁文件里没有 playwright' }
          npx --yes "playwright@$version" install --with-deps chromium
      - name: 打包当前 Framework
        shell: pwsh
        run: pwsh framework/build/pack-local-feed.ps1
      - name: 校验 NuGet 包内容与隔离消费
        shell: pwsh
        run: pwsh framework/build/test-package-consumption.ps1
      - name: 判断是否需要容器验证
        id: container_scope
        shell: pwsh
        run: |
          $before = '${{ github.event_name == 'push' && github.event.before || '' }}'
          if ($before -notmatch '^[0-9a-f]{40}$' -or $before -match '^0+$') { $before = 'HEAD^' }
          git cat-file -e "$before^{commit}" 2>$null
          $hasBase = $LASTEXITCODE -eq 0
          $global:LASTEXITCODE = 0
          $changed = if ($hasBase) { @(git diff --name-only $before HEAD) } else { @('template/Dockerfile') }
          if ($LASTEXITCODE -ne 0) { throw '无法确定容器验证的变更范围' }
          $needed = @($changed | Where-Object {
            $_ -match '^template/(Dockerfile|\.dockerignore)$' -or
            $_ -match '^template/deploy/' -or
            $_ -eq 'template/.template.config/template.json' -or
            $_ -match '^template/frontend/(package(-lock)?\.json|angular\.json)$'
          }).Count -gt 0
          "needed=$($needed ? 'true' : 'false')" | Out-File $env:GITHUB_OUTPUT -Append
      - name: 生成并验证全部模板场景
        shell: pwsh
        run: |
          $containerArgs = if ('${{ steps.container_scope.outputs.needed }}' -eq 'true') { @('-ContainerSmokeScenarios', 'standalone') } else { @() }
          pwsh scripts/test-template-matrix.ps1 -SkipPack @containerArgs
          if ($LASTEXITCODE -ne 0) { throw '模板矩阵失败' }

  test:
    name: 框架单元测试
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 分布式锁的 Redis 契约用例需要真实服务：没有服务时它们会跳过而不是失败
    # （提交前自检必须在没装 Redis 的机器上也全绿），因此这里显式提供并在下面 ping 一次
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
      - name: 安装 .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: 还原
        run: dotnet restore framework/Leistd.Framework.slnx
      - name: 构建
        run: dotnet build framework/Leistd.Framework.slnx -c Release --no-restore
      # 不收集覆盖率：此前收集 23 份 cobertura 却没有任何下游步骤消费，
      # 产物直接丢弃，只留下"我们在度量覆盖率"的假信号。
      # 覆盖率定位为按需体检，命令见 framework/build/coverage.runsettings
      # 跳过是本地的让步，不是 CI 的。少了 Redis 服务时这一步直接红，
      # 而不是让锁的契约用例悄无声息地跳过去
      - name: 确认 Redis 可用
        run: |
          docker run --rm --network host redis:7-alpine \
            redis-cli -h 127.0.0.1 -p 6379 ping | grep -q PONG
      - name: 测试
        run: dotnet test framework/Leistd.Framework.slnx -c Release --no-build

  postgresql-e2e:
    name: 模板 PostgreSQL 端到端
    runs-on: ubuntu-latest
    # 本地实测 36 秒（冷约 70–80 秒，含镜像拉取）；关键路径是 template-matrix，
    # 因此这个作业并行跑不增加 CI 墙钟
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
      - name: 安装 .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # 矩阵的运行时冒烟跑在 EF InMemory 上：不建表、不翻译查询，
      # 因而验不到迁移路由、租户跨库隔离、Secret 分离这几类"不报错只给错结果"的失效。
      # 脚本自带 postgres:15-alpine 容器与清理；不加 -SkipPack，作业自包含、不依赖其它作业的 feed
      - name: 打包 + 生成 + 迁移 + 真实库隔离验证
        shell: pwsh
        run: pwsh scripts/test-template-postgresql-e2e.ps1
