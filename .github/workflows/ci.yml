name: CI

# PR 与非发布推送的质量闸门（与 release.yml 分离，不发包）：
#   - docs-sync：组件文档、Skill 与引用一致性
#   - template-matrix：打包当前框架并验证全部条件场景的生成、运行与前后端构建
#   - test：框架单元测试 + 覆盖率（P8）
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  docs-sync:
    name: 文档与 Skill 同步闸门
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装 Skill 校验依赖
        run: python -m pip install PyYAML==6.0.2
      # 闸门清单的唯一来源是 check-all.ps1；新增闸门只改那一处，本文件不必跟着改
      - name: 全部静态闸门
        shell: pwsh
        run: pwsh scripts/check-all.ps1

  template-matrix:
    name: 模板全场景矩阵
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: template/frontend/package-lock.json
      - name: 打包当前 Framework
        shell: pwsh
        run: pwsh framework/build/pack-local-feed.ps1
      - name: 校验 NuGet 包内容与隔离消费
        shell: pwsh
        run: pwsh framework/build/test-package-consumption.ps1
      - name: 生成并验证全部模板场景
        shell: pwsh
        run: pwsh scripts/test-template-matrix.ps1 -SkipPack

  test:
    name: 框架单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: 还原
        run: dotnet restore framework/Leistd.Framework.slnx
      - name: 构建
        run: dotnet build framework/Leistd.Framework.slnx -c Release --no-restore
      - name: 测试 + 覆盖率
        run: dotnet test framework/Leistd.Framework.slnx -c Release --no-build --settings framework/build/coverage.runsettings --collect:"XPlat Code Coverage"
