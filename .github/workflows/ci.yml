name: CI

# PR 的质量闸门；release.yml 对发布候选提交复用同一组作业：
#   - docs-sync：组件文档、Skill 与引用一致性
#   - package-consumption：NuGet 包内容与隔离消费，独立必过
#   - framework-pack：当前候选只打包一次，以不可变 artifact 供消费与分片下载
#   - template-slice-plan / template-slices：按档位读出具名分片（每片验证什么见
#     scripts/template-matrix-scenarios.ps1 的 $MatrixSlices），每片一个作业，消费同一候选包；
#     PR 跑 pr 档子集，release 复用与手动触发默认跑 full 全集
#   - template-matrix：保留必过检查名，核对本档场景集合、完整阶段与包消费结果
#   - test：框架单元测试（含真实 Redis 的分布式锁契约）
#   - postgresql-e2e：模板在真实 PostgreSQL 上的迁移与租户隔离
#   - oidc-e2e：四服务真实 OIDC、委托边界与远端令牌校验
on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      tier:
        description: 模板场景档位
        type: choice
        options: [full, pr]
        default: full
  workflow_call:
    inputs:
      candidate_sha:
        required: true
        type: string
      tier:
        type: string
        default: full

# PR 只跑 pr 档：它能否代表全集由 check-template-scenario-coverage.py 逐行判定，
# 全集在 develop/main 推送、夜间与发布时由 release.yml 复用本工作流执行。
env:
  MATRIX_TIER: ${{ github.event_name == 'pull_request' && 'pr' || inputs.tier || 'full' }}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs-sync:
    name: 文档与 Skill 同步闸门
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装 Skill 校验依赖
        run: python -m pip install PyYAML==6.0.2
      # 闸门清单的唯一来源是 check-all.ps1；新增闸门只改那一处，本文件不必跟着改
      - name: 全部静态闸门
        shell: pwsh
        run: pwsh scripts/check-all.ps1

  template-slice-plan:
    name: 规划模板场景分片
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      slices: ${{ steps.plan.outputs.slices }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          sparse-checkout: scripts
      # 分片名与说明只维护在场景定义里，这里读出来作为 matrix，不在 workflow 重抄
      - name: 读出本档分片
        id: plan
        shell: pwsh
        run: |
          . ./scripts/template-matrix-scenarios.ps1
          $plannedSlices = @($MatrixSlices[$env:MATRIX_TIER].GetEnumerator() | ForEach-Object { [ordered]@{ key = $_.Key; title = $_.Value } })
          if ($plannedSlices.Count -eq 0) { throw "档位 $env:MATRIX_TIER 没有登记分片" }
          "slices=$(ConvertTo-Json -InputObject $plannedSlices -Compress)" | Out-File $env:GITHUB_OUTPUT -Append

  template-slices:
    name: 模板场景 · ${{ matrix.slice.title }}
    needs: [framework-pack, template-slice-plan]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        slice: ${{ fromJSON(needs.template-slice-plan.outputs.slices) }}
    outputs:
      container_needed: ${{ steps.container_scope.outputs.needed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          fetch-depth: 0
      - name: 安装 .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            template/frontend/package-lock.json
            template/.template.config/localization/frontend/package-lock.json
      # 前端单测跑在 Playwright 的 Chromium 里；版本取模板锁文件，与生成项目实际安装的一致
      - name: 安装单测用的 Chromium
        shell: pwsh
        run: |
          # 锁文件根包的键是空字符串，ConvertFrom-Json 须用 -AsHashTable 才能解析
          $version = (Get-Content template/frontend/package-lock.json -Raw | ConvertFrom-Json -AsHashTable).packages['node_modules/playwright'].version
          if (-not $version) { throw '模板锁文件里没有 playwright' }
          npx --yes "playwright@$version" install --with-deps chromium
      - name: 下载同一候选 Framework 包
        uses: actions/download-artifact@v4
        with:
          name: candidate-framework-feed
          path: .tmp/local-feed
      - name: 判断是否需要容器验证
        id: container_scope
        shell: pwsh
        run: |
          # PR 用完整 base→head 差异；发布候选用完整 main 差异，无法确定时保守验证。
          $base = '${{ github.event.pull_request.base.sha }}'
          if ($base -notmatch '^[0-9a-f]{40}$') {
            $base = git merge-base origin/main HEAD 2>$null
          }
          $hasBase = $base -match '^[0-9a-f]{40}$'
          if ($hasBase -and $base -eq (git rev-parse HEAD)) { $hasBase = $false }
          if ($hasBase) {
            git cat-file -e "$base^{commit}" 2>$null
            $hasBase = $LASTEXITCODE -eq 0
          }
          $global:LASTEXITCODE = 0
          $changed = if ($hasBase) { @(git diff --name-only $base HEAD) } else { @('template/Dockerfile') }
          if ($LASTEXITCODE -ne 0) { throw '无法确定容器验证的变更范围' }
          $needed = @($changed | Where-Object {
            $_ -match '^template/(Dockerfile|\.dockerignore)$' -or
            $_ -match '^template/deploy/' -or
            $_ -eq 'template/.template.config/template.json' -or
            $_ -match '^template/(frontend|\.template\.config/localization/frontend)/(package(-lock)?\.json|angular\.json)$'
          }).Count -gt 0
          "needed=$($needed ? 'true' : 'false')" | Out-File $env:GITHUB_OUTPUT -Append
      - name: 生成并验证本片全部场景
        id: matrix
        shell: pwsh
        run: |
          # @(...) 包住整个 if：单元素数组经 if 输出会展开成字符串，@ 展开字符串会把它拆成单个字符
          $containerArgs = @(if ('${{ steps.container_scope.outputs.needed }}' -eq 'true') { '-ContainerSmoke' })
          pwsh scripts/test-template-matrix.ps1 -SkipPack -Tier $env:MATRIX_TIER -Slice '${{ matrix.slice.key }}' @containerArgs
          if ($LASTEXITCODE -ne 0) { throw '模板矩阵失败' }
      - name: 保留完整场景结果
        uses: actions/upload-artifact@v4
        with:
          name: template-matrix-${{ matrix.slice.key }}
          overwrite: true
          path: ${{ steps.matrix.outputs.results_path }}
          if-no-files-found: error

  framework-pack:
    name: 打包候选 Framework
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: 打包当前 Framework
        shell: pwsh
        run: pwsh framework/build/pack-local-feed.ps1
      - name: 保留同一候选包源
        uses: actions/upload-artifact@v4
        with:
          name: candidate-framework-feed
          overwrite: true
          path: .tmp/local-feed/*.nupkg
          if-no-files-found: error

  package-consumption:
    name: NuGet 包内容与隔离消费
    needs: framework-pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: 下载同一候选 Framework 包
        uses: actions/download-artifact@v4
        with:
          name: candidate-framework-feed
          path: .tmp/local-feed
      - name: 隔离消费全部包
        shell: pwsh
        run: |
          pwsh framework/build/test-package-consumption.ps1
          if ($LASTEXITCODE -ne 0) { throw 'NuGet 包消费失败' }

  template-matrix:
    name: 模板全场景矩阵
    runs-on: ubuntu-latest
    needs: [template-slices, package-consumption]
    if: always()
    timeout-minutes: 5
    steps:
      - name: 检查必要作业全部成功
        shell: pwsh
        env:
          SLICES_RESULT: ${{ needs.template-slices.result }}
          PACKAGES_RESULT: ${{ needs.package-consumption.result }}
        run: |
          if ($env:SLICES_RESULT -cne 'success' -or $env:PACKAGES_RESULT -cne 'success') {
            throw '模板分片或 NuGet 消费失败、缺失、跳过或取消'
          }
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: template-matrix-*
          path: .tmp/matrix-receipts
          merge-multiple: true
      - name: 核对场景全集和完整阶段
        shell: pwsh
        env:
          CONTAINER_NEEDED: ${{ needs.template-slices.outputs.container_needed }}
        run: |
          if ($env:CONTAINER_NEEDED -notin @('true', 'false')) { throw '缺少容器范围判定结果' }
          $containerArgs = @(if ($env:CONTAINER_NEEDED -eq 'true') { '-ContainerSmoke' })
          pwsh scripts/check-template-matrix-results.ps1 -ResultsPath .tmp/matrix-receipts -Tier $env:MATRIX_TIER @containerArgs
          if ($LASTEXITCODE -ne 0) { throw '模板矩阵证明不完整' }

  test:
    name: 框架单元测试
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 分布式锁的 Redis 契约用例需要真实服务：没有服务时它们会跳过而不是失败
    # （提交前自检必须在没装 Redis 的机器上也全绿），因此这里显式提供并在下面 ping 一次
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
      - name: 安装 .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: 还原
        run: dotnet restore framework/Leistd.Framework.slnx
      - name: 构建
        run: dotnet build framework/Leistd.Framework.slnx -c Release --no-restore
      # 不收集覆盖率：此前收集 23 份 cobertura 却没有任何下游步骤消费，
      # 产物直接丢弃，只留下"我们在度量覆盖率"的假信号。
      # 覆盖率定位为按需体检，命令见 framework/build/coverage.runsettings
      # 跳过是本地的让步，不是 CI 的。少了 Redis 服务时这一步直接红，
      # 而不是让锁的契约用例悄无声息地跳过去
      - name: 确认 Redis 可用
        run: |
          docker run --rm --network host redis:7-alpine \
            redis-cli -h 127.0.0.1 -p 6379 ping | grep -q PONG
      - name: 测试
        run: dotnet test framework/Leistd.Framework.slnx -c Release --no-build

  postgresql-e2e:
    name: 模板 PostgreSQL 端到端
    runs-on: ubuntu-latest
    # 独立真实库契约；与模板分片、包消费和 OIDC 并行，保持自包含。
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
      - name: 安装 .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # 矩阵的运行时冒烟跑在 EF InMemory 上：不建表、不翻译查询，
      # 因而验不到迁移路由、租户跨库隔离、Secret 分离这几类"不报错只给错结果"的失效。
      # 脚本自带 postgres:15-alpine 容器与清理；不加 -SkipPack，作业自包含、不依赖其它作业的 feed
      - name: 打包 + 生成 + 迁移 + 真实库隔离验证
        shell: pwsh
        run: pwsh scripts/test-template-postgresql-e2e.ps1

  oidc-e2e:
    name: 模板 OIDC 跨服务端到端
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
      - name: 安装 .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # 脚本自包含包源、四个真实 API、PostgreSQL 与 finally 清理。
      # S7 默认只验即时撤销与到期前窗口，不在 PR 等待十分钟；完整边界用 -IncludeExpiryWait。
      - name: 打包 + 生成 + OIDC HTTP S2–S8 与 S10
        shell: pwsh
        run: pwsh scripts/test-template-oidc-e2e.ps1
      - name: 保留 OIDC 诊断证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oidc-e2e-logs
          # 只上传日志和脱敏断言，生成项目、密钥与 NuGet 缓存不上传。
          path: |
            .tmp/oidc-e2e/**/*.log
            .tmp/oidc-e2e/**/assertions.jsonl
            .tmp/oidc-e2e/**/results.json
            .tmp/oidc-e2e/**/topology.json
            .tmp/oidc-e2e/**/cleanup.json
