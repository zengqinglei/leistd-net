/* VOICE: 设计评审稿，冷静、可对照；结论先行，再给证据。
   IDEA: 产品截图评审板——1440 宽的真实页面帧，配红/蓝编号批注。
   PICTURE: 每套方案的四张帧（列表、抽屉），首屏线标出 900px。
   COLOUR and TYPE: 直接用模板 styles.css 的令牌与 Geist，帧外只用中性色。
   LAYOUT: 顶部结论与待定事项，方案切换条，帧在上、批注在下。 */
:root{color-scheme:light dark;
--background:light-dark(oklch(1 0 0),oklch(0.2 0.006 255));
--foreground:light-dark(oklch(0.18 0.01 255),oklch(0.94 0.003 255));
--card:light-dark(oklch(1 0 0),oklch(0.225 0.006 255));
--primary:light-dark(oklch(0.52 0.16 250),oklch(0.72 0.14 250));
--primary-foreground:light-dark(oklch(0.99 0.002 250),oklch(0.18 0.02 255));
--secondary:light-dark(oklch(0.966 0.004 250),oklch(0.27 0.006 255));
--secondary-foreground:light-dark(oklch(0.24 0.02 255),oklch(0.94 0.003 255));
--muted:light-dark(oklch(0.966 0.004 250),oklch(0.27 0.006 255));
--muted-foreground:light-dark(oklch(0.505 0.015 255),oklch(0.72 0.012 250));
--destructive:light-dark(oklch(0.457 0.245 27.325),oklch(0.759 0.191 22.216));
--warning:light-dark(oklch(0.47 0.12 70),oklch(0.8 0.14 75));
--success:light-dark(oklch(0.51 0.13 155),oklch(0.76 0.15 155));
--border:light-dark(oklch(0.925 0.005 250),oklch(1 0 0 / 10%));
--input:light-dark(oklch(0.86 0.02 250),oklch(1 0 0 / 22%));
--sidebar:light-dark(oklch(0.985 0.002 250),oklch(0.225 0.006 255));
--board:light-dark(oklch(0.955 0.004 250),oklch(0.16 0.006 255));
--pin-new:oklch(0.55 0.2 262);--pin-cur:oklch(0.6 0.22 27)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--board);color:var(--foreground);font:15px/1.6 Geist,system-ui,"PingFang SC","Microsoft YaHei",sans-serif;overflow-x:clip}
code,.font-mono{font-family:"Geist Mono",ui-monospace,monospace}
.vp{max-width:1440px;overflow:hidden;border-radius:12px;box-shadow:0 1px 0 var(--border),0 12px 32px -12px oklch(0 0 0 / 25%);outline:1px solid var(--border)}
.frame{font-size:14px;line-height:1.5}
.mk{position:absolute;top:-9px;right:-9px;z-index:30;width:20px;height:20px;border-radius:999px;display:grid;place-items:center;font:600 11px/1 Geist,sans-serif;color:#fff;box-shadow:0 0 0 2px var(--background)}
.mk.new{background:var(--pin-new)}.mk.cur{background:var(--pin-cur)}
.lg{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:999px;font:600 11px/1 Geist,sans-serif;color:#fff;flex:none;margin-top:2px}
.lg.new{background:var(--pin-new)}.lg.cur{background:var(--pin-cur)}
.fold{position:absolute;left:0;right:0;top:900px;border-top:2px dashed var(--pin-cur);z-index:40;pointer-events:none}
.fold::after{content:"首屏 1440×900";position:absolute;right:12px;top:-24px;font:600 12px/1 Geist;color:#fff;background:var(--pin-cur);padding:5px 8px;border-radius:6px}
.scheme{display:none}.scheme.on{display:block}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<style type="text/tailwindcss">
@theme inline{
--font-sans:Geist,system-ui,"PingFang SC",sans-serif;--font-mono:"Geist Mono",ui-monospace,monospace;
--color-background:var(--background);--color-foreground:var(--foreground);--color-card:var(--card);
--color-primary:var(--primary);--color-primary-foreground:var(--primary-foreground);
--color-secondary:var(--secondary);--color-secondary-foreground:var(--secondary-foreground);
--color-muted:var(--muted);--color-muted-foreground:var(--muted-foreground);
--color-destructive:var(--destructive);--color-warning:var(--warning);--color-success:var(--success);
--color-border:var(--border);--color-input:var(--input);--color-sidebar:var(--sidebar);--color-board:var(--board)}
@layer base{*,::after,::before{border-color:var(--border)}}
</style>
</head>

const ic=(n,c='size-4')=>`<svg class="${c} shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]}</svg>`;
const BV={secondary:'bg-secondary text-secondary-foreground',success:'bg-success/10 text-success',warning:'bg-warning/10 text-warning',destructive:'bg-destructive/10 text-destructive',outline:'border-border text-foreground'};
const bd=(v,t,dot=true)=>`<span class="inline-flex h-5 w-fit shrink-0 items-center gap-1 rounded-full border border-transparent px-2 text-xs font-medium whitespace-nowrap ${BV[v]}">${dot?`<span class="size-1.5 rounded-full ${v==='secondary'?'bg-muted-foreground':'bg-current'}"></span>`:''}${t}</span>`;
const BT={default:'bg-primary text-primary-foreground',secondary:'bg-secondary text-secondary-foreground',outline:'border border-input bg-background',ghost:'text-foreground',danger:'border border-input bg-background text-destructive'};
const SZ={md:'h-8 px-3',sm:'h-7 px-2.5 text-[13px]',icon:'size-8',iconSm:'size-7 text-muted-foreground'};
const bt=(v,c,s='md',x='')=>`<span class="inline-flex shrink-0 items-center justify-center gap-1.5 whitespace-nowrap rounded-md text-sm font-medium ${BT[v]} ${SZ[s]} ${x}">${c}</span>`;
const search=(ph,w='w-64')=>`<span class="flex h-8 ${w} items-center gap-2 rounded-md border border-input bg-background px-2.5 text-sm text-muted-foreground">${ic('search')}<span class="truncate">${ph}</span></span>`;
const facet=(l,v)=>`<span class="inline-flex h-8 shrink-0 items-center gap-1.5 whitespace-nowrap rounded-md border border-dashed border-input px-2.5 text-sm font-medium">${ic('plusCircle')}${l}${v?`<span class="mx-1 h-4 w-px bg-border"></span>${bd('secondary',v,false)}`:''}</span>`;

const sec=(t,body,act='')=>`<section class="flex flex-col gap-3"><div class="flex min-h-7 items-center justify-between gap-3 border-b pb-3"><h3 class="text-sm font-semibold">${t}</h3>${act}</div>${body}</section>`;
const dl=(pairs,mono=false)=>`<dl class="grid grid-cols-[8rem_minmax(0,1fr)] gap-x-4 gap-y-2 text-sm ${mono?'font-mono text-xs':''}">${pairs.map(([k,v])=>`<dt class="text-muted-foreground ${mono?'break-all':''}">${k}</dt><dd class="min-w-0 break-words">${v}</dd>`).join('')}</dl>`;
const pre=t=>`<pre class="m-0 overflow-x-auto rounded-md bg-muted p-3 font-mono text-xs leading-relaxed whitespace-pre-wrap break-all">${t}</pre>`;
const alert=(tone,title,body)=>`<div class="flex gap-3 rounded-lg border px-4 py-3 text-sm ${tone==='destructive'?'text-destructive':'text-warning'}">${ic('alert','size-4 mt-0.5')}<div class="flex flex-col gap-1"><p class="font-medium">${title}</p><p class="text-muted-foreground">${body}</p></div></div>`;

const common=`<section id="common" class="grid gap-6 lg:grid-cols-[minmax(0,1.3fr)_minmax(0,1fr)]"><div class="flex flex-col gap-3 rounded-xl border bg-background p-6"><h2 class="m-0 text-lg font-semibold">三套方案都包含的改动</h2><ol class="m-0 flex flex-col gap-2 ps-5 text-sm"><li><b>时间范围</b>：发件箱、收件箱、拒收、投递日志的工具栏右组加日期区间，组件与写法照搬操作记录。事件目录和订阅是配置清单，不加。</li><li><b>刷新</b>：两页都放在列表工具栏右组，顺序为「时间范围 → 刷新 → 主操作」。用 secondary，加载时转 spinner，不禁用。</li><li><b>发件箱 checkbox</b>：每一行都渲染；不可恢复的行禁用并给 Tooltip。收件箱、拒收共用同一张表，一起修。</li><li><b>状态</b>：快捷 toggle-group 代替状态分面；徽章按规范 §5 带状态点；发件箱 pending 统一叫「待发送」。</li><li><b>批量恢复</b>：只在有勾选、或状态筛到可恢复状态时出现，不再常驻禁用按钮。</li><li><b>抽屉</b>：标题 16px + 徽章，下一行元信息；操作在标题行右侧，破坏性操作进 … 菜单；顶部 Alert 写原因和下一步；dl 统一 8rem 标签列。</li></ol></div><div class="flex flex-col gap-3 rounded-xl border bg-background p-6"><h2 class="m-0 text-lg font-semibold">需要你定的事</h2><ol class="m-0 flex flex-col gap-2 ps-5 text-sm"><li>选哪套布局：推荐 <b>A</b>，它与规范和其他平台页一致；B、C 各有一处明显偏离规范。</li><li>Webhook 的统计区间和列表时间范围：A 让二者分开、跳转时带入；B 合并为一个控件。</li><li>发件箱不可恢复的行：A 禁用勾选（推荐）；或者允许勾选，提交后在结果里报「跳过 n 条」，后端已经支持返回 invalid-state。</li><li>订阅、事件目录要不要也加时间范围（默认不加）。</li></ol><h3 class="m-0 mt-2 text-sm font-semibold">后端影响</h3><p class="m-0 text-sm text-muted-foreground">三个分布式事件列表输入和 <code>GetWebhookDeliveriesInputDto</code> 都要加 <code>startTime</code> / <code>endTime</code>，命名与操作记录一致。分布式事件按条件恢复的 filter 也要带上这两个字段，确认框的「筛选」一栏写出时间范围；现有的 <code>before</code>（加载截止）保留。</p></div></section>`;

document.getElementById('app').innerHTML=`<header class="bg-background border-b"><div class="mx-auto flex max-w-[1520px] flex-col gap-4 px-6 pt-8 pb-5"><p class="m-0 text-sm text-muted-foreground">leistd-net 模板 · 平台管理 / 集成 · 2026-11-19 · 基于 develop c42d3685，数据为示例</p><h1 class="m-0 max-w-4xl text-[40px] leading-[1.08] font-semibold text-balance">分布式事件、Webhook 与租户授予访问：列表、抽屉和对话框的布局方案</h1><p class="m-0 max-w-3xl text-muted-foreground">推荐方案 A：照规范骨架重排，补时间范围，把刷新挪进列表工具栏，修掉发件箱复选框。B 让首屏多出一倍的行数，C 适合逐条处理，但两者各有偏离规范的地方。租户的「授予访问」推荐 D1：选择框加账号预览，修改角色时显示是谁。</p></div><nav class="sticky top-0 z-50 border-t bg-background/95 backdrop-blur"><div class="mx-auto flex max-w-[1520px] flex-wrap gap-1 px-6 py-2" id="nav">${SCHEMES.map(s=>`<a href="#${s.id}" data-id="${s.id}" class="inline-flex min-h-10 items-center rounded-md px-3 text-sm font-medium no-underline text-foreground">${s.label}</a>`).join('')}</div></nav></header><div class="mx-auto flex max-w-[1520px] flex-col gap-10 px-6 py-8">${common}${SCHEMES.map(s=>`<section id="s-${s.id}" class="scheme flex flex-col gap-16">${s.html()}</section>`).join('')}</div>`;

function fit(){for(const vp of document.querySelectorAll('.scheme.on .vp')){const z=vp.querySelector('.zoom');z.style.zoom=Math.min(1,vp.clientWidth/1440)}}
function show(){const id=(location.hash||'#a').slice(1);const ok=SCHEMES.some(s=>s.id===id)?id:'a';for(const s of document.querySelectorAll('.scheme'))s.classList.toggle('on',s.id==='s-'+ok);document.getElementById('common').style.display=ok==='tenants'?'none':'';for(const a of document.querySelectorAll('#nav a')){const on=a.dataset.id===ok;a.classList.toggle('bg-muted',on);a.setAttribute('aria-current',on?'page':'false')}requestAnimationFrame(fit)}
addEventListener('hashchange',show);
const ro=new ResizeObserver(fit);ro.observe(document.body);
show();
}
