services:
  db-migrator:
    image: ghcr.io/zengqinglei/companyname-projectname-migrator:latest
    build:
      context: ..
      dockerfile: Dockerfile
      target: migrator
    environment:
      - ConnectionStrings__Default=Host=db;Port=5432;Database=MyProject;Username=postgres;Password=${MIGRATOR_DB_PASSWORD:?MIGRATOR_DB_PASSWORD is required};GSS Encryption Mode=Disable
      # Resource DbMigrator 使用独立客户端凭据，只授予 tenant-migration.read。
      - Leistd__ServiceClients__Identity__Scope=tenant-migration.read
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks:
      - companyname-projectname-network

  backend:
    image: ghcr.io/zengqinglei/companyname-projectname:latest
    container_name: companyname-projectname
    build:
      context: ..
      dockerfile: Dockerfile
      target: api
    ports:
      - "80:8080"
    environment:
      # Environment
      - TZ=Asia/Shanghai
      - ASPNETCORE_ENVIRONMENT=Production

      # Database Configuration (PostgreSQL)
      - ConnectionStrings__Default=Host=db;Port=5432;Database=MyProject;Username=${APP_DB_USER:?APP_DB_USER is required};Password=${APP_DB_PASSWORD:?APP_DB_PASSWORD is required};GSS Encryption Mode=Disable
      # Resource API 的身份只能查运行时路由，不授予迁移元数据 scope。
      - Leistd__ServiceClients__Identity__Scope=tenant-routing.read

      # Redis Configuration — matches the bundled redis service below (no password, no TLS).
      # Production password: set it on BOTH sides —
      #   value: redis:6379,password=YourRedisPassword,abortConnect=false
      #   redis service command: redis-server --appendonly yes --requirepass YourRedisPassword
      # Production TLS: not just "ssl=true" — Redis must be configured for TLS (cert/key + --tls-port,
      #   or a TLS-terminating proxy); only then add ssl=true to the value.
      - ConnectionStrings__Redis=redis:6379,abortConnect=false

      # Default Admin User (Change in production!)
      - DefaultAdmin__Username=admin # optional
      - DefaultAdmin__Password=Admin@123456
      - DefaultAdmin__Email=admin@companyname-projectname.com # optional
      - DefaultAdmin__Nickname=System Administrator # optional

      # CORS Configuration (optional)
      - Cors__AllowAnyLocalhost=false
      # - Cors__AllowedOrigins__0=https://your-domain.com

      # External OAuth (Optional - uncomment and configure if needed)
      # - ExternalAuth__GitHub__ClientId=your-github-client-id
      # - ExternalAuth__GitHub__ClientSecret=your-github-client-secret
      # - ExternalAuth__GitHub__RedirectUri=https://your-domain.com/api/external-auth/github/callback
      # - ExternalAuth__Google__ClientId=your-google-client-id
      # - ExternalAuth__Google__ClientSecret=your-google-client-secret
      # - ExternalAuth__Google__RedirectUri=https://your-domain.com/api/external-auth/google/callback

      # Logging (optional)
      - Serilog__MinimumLevel__Default=Information
      - Serilog__MinimumLevel__Override__MyProject=Information
      - Serilog__MinimumLevel__Override__Microsoft.AspNetCore=Warning
      - Serilog__MinimumLevel__Override__Microsoft.EntityFrameworkCore=Warning

    volumes:
      - feedback-uploads:/app/wwwroot/uploads

    depends_on:
      db:
        condition: service_healthy
      db-migrator:
        condition: service_completed_successfully
      redis:
        condition: service_started

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    restart: unless-stopped

    networks:
      - companyname-projectname-network

  db:
    image: postgres:15-alpine
    container_name: companyname-projectname-db
    environment:
      TZ: Asia/Shanghai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${MIGRATOR_DB_PASSWORD:?MIGRATOR_DB_PASSWORD is required}
      POSTGRES_DB: MyProject
      POSTGRES_INITDB_ARGS: "-E UTF8"
      APP_DB_USER: ${APP_DB_USER:?APP_DB_USER is required}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD is required}

    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/01-create-app-role.sh:/docker-entrypoint-initdb.d/01-create-app-role.sh:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    restart: unless-stopped

    networks:
      - companyname-projectname-network

  redis:
    image: redis:7-alpine
    container_name: companyname-projectname-redis
    environment:
      TZ: Asia/Shanghai
    command: redis-server --appendonly yes

    volumes:
      - redis-data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

    restart: unless-stopped

    networks:
      - companyname-projectname-network

volumes:
  pgdata:
    driver: local
  redis-data:
    driver: local
  feedback-uploads:
    driver: local

networks:
  companyname-projectname-network:
    driver: bridge
