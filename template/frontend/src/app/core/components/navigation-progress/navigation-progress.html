@if (shown()) {
<!--#if (IncludeLocalization)-->
  <ng-container *transloco="let t">
<!--#else-->
  <ng-container>
<!--#endif-->
    <hlm-progress
      class="pointer-events-none absolute inset-x-0 top-0 h-0.5 rounded-none bg-primary/20"
      [value]="null"
      [attr.aria-label]="t('app.navigation.loading')"
    >
      <hlm-progress-indicator
        class="animate-navigation-progress! motion-reduce:animate-none! motion-reduce:transition-none"
      />
    </hlm-progress>
  </ng-container>
}
