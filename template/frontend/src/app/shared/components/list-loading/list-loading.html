<!--#if (IncludeLocalization)-->
<ng-container *transloco="let t">
<!--#else-->
<ng-container>
<!--#endif-->
  <div class="flex flex-col gap-1" role="status" aria-live="polite">
    <span class="sr-only">{{ t('app.startup.loading') }}</span>
    @for (row of rowIndexes(); track row) {
      <div class="flex items-center gap-3 px-2 py-2" aria-hidden="true">
        @if (checkbox()) {
          <div hlmSkeleton class="size-4 shrink-0 rounded-sm"></div>
        }
        <div class="flex min-w-0 flex-1 flex-col gap-1.5">
          <div hlmSkeleton class="h-4 w-32 max-w-full"></div>
          <div hlmSkeleton class="h-3.5 w-20 max-w-full"></div>
        </div>
      </div>
    }
  </div>
</ng-container>
