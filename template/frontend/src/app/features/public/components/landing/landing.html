<!--#if (IncludeLocalization)-->
<ng-container *transloco="let t; prefix: 'landing'">
<!--#else-->
<ng-container>
<!--#endif-->
  <div class="min-h-screen flex flex-col items-center justify-center bg-background px-6 relative">
    <!-- Theme Toggle -->
    <div class="absolute top-4 right-4 flex gap-2 z-50">
      <app-theme-mode-toggle />
      <!--#if (IncludeLocalization)-->
      <app-language-switcher />
      <!--#endif-->
    </div>

    <div class="flex max-w-2xl flex-col gap-8 text-center">
      <h1 class="text-3xl font-semibold tracking-tight text-balance">
        {{ t('hero.title') }}
      </h1>
      <p class="text-base text-muted-foreground">{{ t('hero.subtitle') }}</p>

      <div class="flex items-center justify-center gap-4">
        <!--#if (LocalIdentity)-->
        <a hlmBtn routerLink="/auth/login">{{ t('hero.login') }}</a>
        <a hlmBtn variant="outline" routerLink="/auth/register">{{ t('hero.register') }}</a>
        <!--#else-->
        <!-- 登录与注册都在签发令牌的身份服务上：进入工作台时由守卫发起 OIDC 登录 -->
        <a hlmBtn routerLink="/workspace">{{ t('hero.login') }}</a>
        <!--#endif-->
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-3 gap-6 pt-8">
        <div class="p-6 rounded-xl bg-card border border-border">
          <ng-icon name="lucideShield" class="text-3xl text-primary mb-3" />
          <h3 class="font-semibold">{{ t('feature.authTitle') }}</h3>
          <p class="text-sm text-muted-foreground mt-2">
            {{ t('feature.authDesc') }}
          </p>
        </div>
        <div class="p-6 rounded-xl bg-card border border-border">
          <ng-icon name="lucideUsers" class="text-3xl text-primary mb-3" />
          <h3 class="font-semibold">{{ t('feature.usersTitle') }}</h3>
          <p class="text-sm text-muted-foreground mt-2">
            {{ t('feature.usersDesc') }}
          </p>
        </div>
        <div class="p-6 rounded-xl bg-card border border-border">
          <ng-icon name="lucideSunMoon" class="text-3xl text-primary mb-3" />
          <h3 class="font-semibold">{{ t('feature.themeTitle') }}</h3>
          <p class="text-sm text-muted-foreground mt-2">
            {{ t('feature.themeDesc') }}
          </p>
        </div>
      </div>
    </div>
  </div>
</ng-container>
