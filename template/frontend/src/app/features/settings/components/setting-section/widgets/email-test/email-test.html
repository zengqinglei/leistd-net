<!--#if (IncludeLocalization)-->
<ng-container *transloco="let t">
<!--#else-->
<ng-container>
<!--#endif-->
  <!-- 表单包住测试区：收件人与发送按钮投影到测试区的操作区，回车即发送 -->
  <form
    #emailTestRoot
    novalidate
    data-testid="email-test"
    (submit)="$event.preventDefault(); send()"
  >
    <app-setting-test-panel
      icon="lucideSend"
      [heading]="t('settings.emailTest.title')"
      [description]="t('settings.emailTest.description')"
    >
      <hlm-field class="@md/test-panel:w-56">
        <input
          hlmInput
          type="email"
          autocomplete="off"
          spellcheck="false"
          autocapitalize="off"
          data-testid="email-test-to"
          [attr.aria-label]="t('settings.emailTest.recipient')"
          [placeholder]="t('settings.emailTest.recipient')"
          [formField]="emailForm.to"
        />
        @for (error of emailForm.to().errors(); track error.kind) {
          <hlm-field-error [validator]="error.kind">{{
            error.message ?? t('validation.' + error.kind, error)
          }}</hlm-field-error>
        }
      </hlm-field>
      <button
        hlmBtn
        type="submit"
        variant="outline"
        data-testid="email-test-send"
        [disabled]="sending()"
      >
        @if (sending()) {
          <hlm-spinner class="text-base" data-icon="inline-start" />
        } @else {
          <ng-icon name="lucideSend" data-icon="inline-start" />
        }
        {{ t('settings.emailTest.send') }}
      </button>
    </app-setting-test-panel>
  </form>
</ng-container>
