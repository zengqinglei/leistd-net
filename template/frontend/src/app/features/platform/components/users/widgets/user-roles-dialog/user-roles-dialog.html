<!--#if (IncludeLocalization)-->
<ng-container *transloco="let t">
<!--#else-->
<ng-container>
<!--#endif-->
  <hlm-dialog
    disableClose
    [closeOnOutsidePointerEvents]="false"
    [state]="open() ? 'open' : 'closed'"
    (stateChanged)="open.set($event === 'open')"
  >
    <hlm-dialog-content
      appImeGuard
      *hlmDialogPortal
      [showCloseButton]="false"
      (keydown.escape)="closeGuard.requestClose($event)"
      class="sm:max-w-md"
    >
      <hlm-dialog-header>
        <h2 hlmDialogTitle>
          {{ t('users.rolesDialog.title', { name: user()?.username ?? '' }) }}
        </h2>
        <p hlmDialogDescription>{{ t('users.rolesDialog.description') }}</p>
      </hlm-dialog-header>
      <form #selectionFormRoot novalidate (submit)="$event.preventDefault(); onSave()">
        <div data-dialog-body>
          <div class="flex flex-col gap-1 py-2">
            @for (role of availableRoles(); track role.id) {
              <div
                class="flex items-center gap-3 rounded-md px-2 py-2 text-sm hover:bg-muted/50 pointer-coarse:ps-3.5"
              >
                <hlm-checkbox
                  [inputId]="'role-' + role.id"
                  [checked]="isSelected(role.id)"
                  (checkedChange)="toggle(role.id)"
                />
                <label class="flex flex-col" [attr.for]="'role-' + role.id">
                  <span>{{ role.displayName }}</span>
                  <span class="text-xs text-muted-foreground">{{ role.name }}</span>
                </label>
              </div>
            } @empty {
              <p class="py-6 text-center text-sm text-muted-foreground">
                {{ t('common.noData') }}
              </p>
            }
          </div>

          @if (rolesError(); as error) {
            <p role="alert">
              {{ error }}
              <button hlmBtn variant="outline" type="button" (click)="reloadRoles.emit()">
                {{ t('common.retry') }}
              </button>
            </p>
          }
          @if (rolesLoading()) {
            <hlm-spinner [aria-label]="t('app.startup.loading')" />
          }
        </div>
        <hlm-dialog-footer>
          <button
            [disabled]="closeGuard.busy()"
            hlmBtn
            variant="outline"
            type="button"
            (click)="closeGuard.requestClose()"
          >
            {{ t('common.cancel') }}
          </button>
          <button hlmBtn type="submit" [disabled]="saving() || rolesLoading() || !!rolesError()">
            @if (saving()) {
              <hlm-spinner
                [aria-label]="t('app.startup.loading')"
                class="size-4"
                data-icon="inline-start"
              />
            }
            {{ t('common.save') }}
          </button>
        </hlm-dialog-footer>
      </form>

      <app-dialog-close
        #closeGuard="appDialogClose"
        [dirty]="selectionDirty()"
        [busy]="saving()"
        (dismissed)="open.set(false)"
      />
    </hlm-dialog-content>
  </hlm-dialog>
</ng-container>
