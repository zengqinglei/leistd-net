<!--#if (IncludeLocalization)-->
<ng-container *transloco="let t">
<!--#else-->
<ng-container>
<!--#endif-->
  <hlm-dialog
    disableClose
    [closeOnOutsidePointerEvents]="false"
    [state]="visible() ? 'open' : 'closed'"
    (stateChanged)="onDialogStateChange($event)"
  >
    <hlm-dialog-content
      appImeGuard
      *hlmDialogPortal
      [showCloseButton]="false"
      (keydown.escape)="closeGuard.requestClose($event)"
      class="sm:max-w-md"
    >
      <hlm-dialog-header>
        <h2 hlmDialogTitle>{{ t('users.resetDialog.header') }}</h2>
      </hlm-dialog-header>

      <form (submit)="$event.preventDefault(); save()" #resetFormRoot novalidate>
        <div data-dialog-body class="flex flex-col gap-4 py-1">
          <div class="flex flex-col gap-4">
            <div hlmAlert>
              <ng-icon name="lucideTriangleAlert" aria-hidden="true" />
              <p hlmAlertDescription>{{ t('users.resetDialog.warning') }}</p>
            </div>

            <div hlmField>
              <label hlmFieldLabel for="reset-password">{{
                t('users.resetDialog.newPasswordLabel')
              }}</label>
              <hlm-input-group>
                <input
                  hlmInputGroupInput
                  id="reset-password"
                  autocomplete="new-password"
                  [type]="showPassword() ? 'text' : 'password'"
                  [formField]="resetForm.password"
                  [placeholder]="t('users.resetDialog.newPasswordPlaceholder')"
                />
                <button
                  hlmInputGroupButton
                  type="button"
                  size="icon-sm"
                  align="inline-end"
                  [attr.aria-label]="
                    showPassword() ? t('common.hidePassword') : t('common.showPassword')
                  "
                  (click)="showPassword.set(!showPassword())"
                >
                  <ng-icon [name]="showPassword() ? 'lucideEyeOff' : 'lucideEye'" />
                </button>
              </hlm-input-group>
              <app-password-length-meter [password]="resetForm.password().value()" />
              @for (error of resetForm.password().errors(); track error.kind) {
                <hlm-field-error [validator]="error.kind">{{
                  error.message ?? t('validation.' + error.kind, error)
                }}</hlm-field-error>
              }
            </div>
          </div>
        </div>
        <hlm-dialog-footer>
          <button
            [disabled]="closeGuard.busy()"
            hlmBtn
            type="button"
            variant="ghost"
            (click)="closeGuard.requestClose()"
          >
            {{ t('common.cancel') }}
          </button>
          <button hlmBtn type="submit" [disabled]="saving()">
            @if (saving()) {
              <hlm-spinner class="text-base" data-icon="inline-start" />
            }
            {{ t('users.resetDialog.confirmButton') }}
          </button>
        </hlm-dialog-footer>
      </form>
      <app-dialog-close
        #closeGuard="appDialogClose"
        [dirty]="resetForm().dirty()"
        [busy]="saving()"
        (dismissed)="visible.set(false)"
      />
    </hlm-dialog-content>
  </hlm-dialog>
</ng-container>
