<div class="flex flex-col h-full overflow-hidden">
  <div class="flex-1 overflow-y-auto p-4 sm:p-6">
    <div class="mb-6 flex flex-col items-stretch justify-between gap-4 md:flex-row md:items-center">
      <div class="flex flex-1 flex-col items-stretch gap-3 sm:flex-row sm:items-center">
        <app-faceted-filter
          [label]="statusFilterLabel()"
          [options]="activeOptions()"
          [value]="selectedIsActive()"
          [searchPlaceholder]="statusFilterLabel()"
          [clearLabel]="filterClearLabel()"
          [emptyLabel]="filterEmptyLabel()"
          (valueChange)="onActiveChange($any($event))"
        />

        <app-faceted-filter
          [label]="emailFilterLabel()"
          [options]="emailVerifiedOptions()"
          [value]="selectedIsEmailVerified()"
          [searchPlaceholder]="emailFilterLabel()"
          [clearLabel]="filterClearLabel()"
          [emptyLabel]="filterEmptyLabel()"
          (valueChange)="onEmailVerifiedChange($any($event))"
        />

        <app-faceted-filter
          multiple
          [label]="roleFilterLabel()"
          [options]="roleOptions()"
          [values]="selectedRoles()"
          [searchPlaceholder]="roleFilterLabel()"
          [clearLabel]="filterClearLabel()"
          [emptyLabel]="filterEmptyLabel()"
          (valuesChange)="onRolesChange($event)"
        />

        <hlm-input-group class="w-full sm:max-w-xs sm:flex-1">
          <hlm-input-group-addon>
            <ng-icon name="lucideSearch" />
          </hlm-input-group-addon>
          <input
            hlmInputGroupInput
            type="text"
            [placeholder]="searchPlaceholder()"
            [ngModel]="searchQuery()"
            (ngModelChange)="onSearchQueryChange($event)"
          />
        </hlm-input-group>
      </div>

      <div class="flex items-center justify-end gap-3 shrink-0">
        <button
          hlmBtn
          variant="secondary"
          class="w-full sm:w-auto"
          (click)="onFilter()"
          [hlmTooltip]="refreshLabel()"
        >
          <ng-icon name="lucideRefreshCw" data-icon="inline-start" />
          {{ refreshLabel() }}
        </button>
        <button hlmBtn variant="default" class="w-full sm:w-auto" (click)="openAddDialog()">
          <ng-icon name="lucidePlus" data-icon="inline-start" />
          {{ newUserLabel() }}
        </button>
      </div>
    </div>

    <app-user-table
      [users]="users()"
      [totalRecords]="totalRecords()"
      [loading]="loading()"
      (filterChange)="onPageChange($event)"
      (edit)="openEditDialog($event)"
      (toggleActive)="handleToggleActive($event)"
      (resetPassword)="openResetPasswordDialog($event)"
      (deleteRequested)="handleDelete($event)"
    />
  </div>
</div>

<app-user-edit-dialog
  [(visible)]="editDialogVisible"
  [loading]="editDialogLoading()"
  [saving]="editDialogSaving()"
  [user]="selectedUser()"
  (saved)="handleSave($event)"
/>

<app-reset-user-password-dialog
  [(visible)]="resetPasswordDialogVisible"
  [(saving)]="resetPasswordSaving"
  (saved)="handleResetPassword($event)"
/>
