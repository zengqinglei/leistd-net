<div class="flex flex-col h-full overflow-hidden">
  <div class="flex-1 overflow-y-auto p-6">
    <div class="mb-6 flex flex-col items-stretch justify-between gap-4 md:flex-row md:items-center">
      <div class="flex flex-1 flex-col items-stretch gap-3 sm:flex-row sm:items-center">
        <hlm-select
          class="w-full sm:w-48"
          [value]="selectedIsActive()"
          (valueChange)="onActiveChange($event)"
        >
          <hlm-select-trigger class="w-full">
            <hlm-select-value [placeholder]="allStatusPlaceholder()" />
          </hlm-select-trigger>
          <hlm-select-content *hlmSelectPortal>
            @for (opt of activeOptions(); track opt.value) {
              <hlm-select-item [value]="opt.value">{{ opt.label }}</hlm-select-item>
            }
          </hlm-select-content>
        </hlm-select>

        <hlm-select
          class="w-full sm:w-48"
          [value]="selectedIsEmailVerified()"
          (valueChange)="onEmailVerifiedChange($event)"
        >
          <hlm-select-trigger class="w-full">
            <hlm-select-value [placeholder]="allEmailStatusPlaceholder()" />
          </hlm-select-trigger>
          <hlm-select-content *hlmSelectPortal>
            @for (opt of emailVerifiedOptions(); track opt.value) {
              <hlm-select-item [value]="opt.value">{{ opt.label }}</hlm-select-item>
            }
          </hlm-select-content>
        </hlm-select>

        <hlm-select
          class="w-full sm:w-48"
          [value]="selectedRole()"
          (valueChange)="onRoleChange($event)"
        >
          <hlm-select-trigger class="w-full">
            <hlm-select-value [placeholder]="allRolesPlaceholder()" />
          </hlm-select-trigger>
          <hlm-select-content *hlmSelectPortal>
            @for (opt of roleOptions(); track opt.value) {
              <hlm-select-item [value]="opt.value">{{ opt.label }}</hlm-select-item>
            }
          </hlm-select-content>
        </hlm-select>

        <hlm-input-group class="w-full sm:max-w-xs sm:flex-1">
          <hlm-input-group-addon>
            <ng-icon name="lucideSearch" />
          </hlm-input-group-addon>
          <input
            hlmInputGroupInput
            type="text"
            [placeholder]="searchPlaceholder()"
            [ngModel]="searchQuery()"
            (ngModelChange)="onSearchQueryChange($event)"
          />
        </hlm-input-group>
      </div>

      <div class="flex items-center justify-end gap-3 shrink-0">
        <button
          hlmBtn
          variant="default"
          class="w-full sm:w-auto"
          (click)="onFilter()"
          [hlmTooltip]="refreshLabel()"
        >
          <ng-icon name="lucideRefreshCw" data-icon="inline-start" />
          {{ refreshLabel() }}
        </button>
        <button hlmBtn variant="outline" class="w-full sm:w-auto" (click)="openAddDialog()">
          <ng-icon name="lucidePlus" data-icon="inline-start" />
          {{ newUserLabel() }}
        </button>
      </div>
    </div>

    <app-user-table
      [users]="users()"
      [totalRecords]="totalRecords()"
      [loading]="loading()"
      (filterChange)="onPageChange($event)"
      (edit)="openEditDialog($event)"
      (toggleActive)="handleToggleActive($event)"
      (resetPassword)="openResetPasswordDialog($event)"
      (delete)="handleDelete($event)"
    />
  </div>
</div>

<app-user-edit-dialog
  [(visible)]="editDialogVisible"
  [loading]="editDialogLoading()"
  [saving]="editDialogSaving()"
  [user]="selectedUser()"
  (saved)="handleSave($event)"
/>

<app-reset-user-password-dialog
  [(visible)]="resetPasswordDialogVisible"
  [(saving)]="resetPasswordSaving"
  (saved)="handleResetPassword($event)"
/>
