<div class="flex flex-col h-full overflow-hidden">
  <div class="flex-1 overflow-y-auto p-4 sm:p-6">
    <div class="mb-6 flex flex-col items-stretch justify-between gap-4 md:flex-row md:items-center">
      <div class="flex flex-1 flex-col items-stretch gap-3 sm:flex-row sm:items-center">
        <hlm-input-group class="w-full sm:max-w-xs sm:flex-1">
          <hlm-input-group-addon>
            <ng-icon name="lucideSearch" />
          </hlm-input-group-addon>
          <input
            hlmInputGroupInput
            type="text"
            [placeholder]="searchPlaceholder()"
            [value]="searchQuery()"
            (input)="onSearchQueryChange($any($event.target).value)"
          />
        </hlm-input-group>
      </div>

      <div class="flex items-center justify-end gap-3 shrink-0">
        <button
          hlmBtn
          variant="secondary"
          class="w-full sm:w-auto"
          (click)="reload()"
          [hlmTooltip]="refreshLabel()"
        >
          <ng-icon name="lucideRefreshCw" data-icon="inline-start" />
          {{ refreshLabel() }}
        </button>
        @if (canCreate()) {
          <button hlmBtn variant="default" class="w-full sm:w-auto" (click)="openCreate()">
            <ng-icon name="lucidePlus" data-icon="inline-start" />
            {{ newRoleLabel() }}
          </button>
        }
      </div>
    </div>

    <app-role-table
      [roles]="roles()"
      [totalCount]="totalCount()"
      [pagination]="pagination()"
      [sorting]="sorting()"
      [loading]="loading()"
      [filtered]="hasActiveFilters()"
      [canUpdate]="canUpdate()"
      [canDelete]="canDelete()"
      [canManagePermissions]="canManagePermissions()"
      (paginationChange)="onPaginationChange($event)"
      (sortingChange)="onSortingChange($event)"
      (edit)="openEdit($event)"
      (delete)="onDelete($event)"
      (managePermissions)="openPermissions($event)"
    />
  </div>
</div>

<app-role-edit-dialog [(open)]="editDialogOpen" [role]="editingRole()" (save)="onSave($event)" />

<app-permission-grant-dialog
  [(open)]="permissionDialogOpen"
  providerName="Role"
  [providerKey]="permissionRole()?.id ?? null"
  [subjectName]="permissionRole()?.displayName ?? ''"
  (saved)="onPermissionsSaved()"
/>
