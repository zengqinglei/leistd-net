<!--#if (IncludeLocalization)-->
<ng-container *transloco="let t">
<!--#else-->
<ng-container>
<!--#endif-->
  <div class="p-4 sm:p-6">
    <section hlmCard>
      <div hlmCardHeader>
        <h2 hlmCardTitle class="text-2xl font-semibold tracking-tight">
          {{ t('platform.dashboard.welcome') }}
        </h2>
        <p hlmCardDescription>
          @if (authService.currentUser(); as user) {
            {{ t('platform.dashboard.currentUser', { name: user.displayName || user.username }) }}
          }
        </p>
      </div>
      <div hlmCardContent>
        <p class="text-muted-foreground">{{ t('platform.dashboard.intro') }}</p>
      </div>
    </section>
  </div>
</ng-container>
