<div class="flex flex-col h-full overflow-hidden">
  <div class="flex-1 overflow-y-auto p-4 sm:p-6">
    <!-- 左组用 flex-auto（基准取内容宽度）而不是 flex-1（基准 0）：flex-wrap 按基准判断同一行放不放得下，
         基准为 0 时左组总能挤进来，再在组内把筛选折到第二行、右侧按钮被垂直居中夹在中间。
         也不写死一个基准宽度——中英文下筛选按钮宽度不同，写死的值总有一种语言不够。 -->
    <div class="mb-6 flex flex-wrap items-center justify-between gap-x-4 gap-y-3">
      <div class="flex min-w-0 flex-auto flex-wrap items-center gap-3">
        <hlm-input-group class="w-full sm:w-auto sm:max-w-xs sm:min-w-56 sm:flex-1">
          <hlm-input-group-addon>
            <ng-icon name="lucideSearch" />
          </hlm-input-group-addon>
          <input
            hlmInputGroupInput
            type="text"
            [placeholder]="searchPlaceholder()"
            [value]="searchQuery()"
            (input)="onSearchQueryChange($any($event.target).value)"
          />
        </hlm-input-group>

        <app-faceted-filter
          [label]="appTypeFilterLabel()"
          [options]="applicationTypeOptions()"
          [value]="selectedApplicationType()"
          [searchPlaceholder]="appTypeFilterLabel()"
          [clearLabel]="filterClearLabel()"
          [emptyLabel]="filterEmptyLabel()"
          (valueChange)="onApplicationTypeChange($any($event))"
        />

        <app-faceted-filter
          [label]="clientTypeFilterLabel()"
          [options]="clientTypeOptions()"
          [value]="selectedClientType()"
          [searchPlaceholder]="clientTypeFilterLabel()"
          [clearLabel]="filterClearLabel()"
          [emptyLabel]="filterEmptyLabel()"
          (valueChange)="onClientTypeChange($any($event))"
        />
      </div>

      <!-- 窄屏下按钮用 flex-1 平分一行，不能用 w-full：两个 w-full 并排总宽是容器的两倍，
           而 justify-end 把溢出甩向左侧，最左边的「刷新」被推出屏幕，只剩一条边。 -->
      <div class="ml-auto flex w-full flex-wrap items-center justify-end gap-3 sm:w-auto">
        <button
          hlmBtn
          variant="secondary"
          class="flex-1 sm:flex-none"
          (click)="reloadList()"
          [hlmTooltip]="refreshLabel()"
        >
          <ng-icon name="lucideRefreshCw" data-icon="inline-start" />
          {{ refreshLabel() }}
        </button>
        @if (canCreate()) {
          <button hlmBtn variant="default" class="flex-1 sm:flex-none" (click)="openAddDialog()">
            <ng-icon name="lucidePlus" data-icon="inline-start" />
            {{ createLabel() }}
          </button>
        }
      </div>
    </div>

    <app-open-application-table
      [applications]="applications()"
      [totalCount]="totalRecords()"
      [pagination]="pagination()"
      [sorting]="sorting()"
      [loading]="loading()"
      [filtered]="hasActiveFilters()"
      [canUpdate]="canUpdate()"
      [canDelete]="canDelete()"
      [canResetSecret]="canResetSecret()"
      (paginationChange)="onPaginationChange($event)"
      (sortingChange)="onSortingChange($event)"
      (edit)="openEditDialog($event)"
      (delete)="handleDelete($event)"
      (resetSecret)="handleResetSecret($event)"
    />
  </div>
</div>

<app-open-application-edit-dialog
  [(visible)]="editDialogVisible"
  [loading]="editDialogLoading()"
  [saving]="editDialogSaving()"
  [application]="selectedApplication()"
  (saved)="handleSave($event)"
/>

<!-- 揭示 Client Secret 弹窗（重置 / 新建后复用） -->
<app-secret-reveal-dialog
  [visible]="secretDialogVisible()"
  (visibleChange)="onSecretDialogVisibleChange($event)"
  [secret]="secretValue()"
  [header]="secretHeader()"
/>
