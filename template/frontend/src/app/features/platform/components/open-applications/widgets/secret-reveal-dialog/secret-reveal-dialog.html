<!--#if (IncludeLocalization)-->
<ng-container *transloco="let t">
<!--#else-->
<ng-container>
<!--#endif-->
  <hlm-dialog [state]="visible() ? 'open' : 'closed'" (stateChanged)="onStateChange($event)">
    <hlm-dialog-content
      *hlmDialogPortal
      class="flex max-h-[calc(100dvh-2rem)] flex-col overflow-hidden sm:max-w-md"
    >
      <hlm-dialog-header>
        <h3 hlmDialogTitle>{{ header() }}</h3>
      </hlm-dialog-header>

      <div class="flex min-h-0 flex-1 flex-col gap-3 overflow-y-auto">
        <div
          class="rounded-lg border border-warning/30 bg-warning/10 px-3 py-2 text-sm text-warning"
        >
          {{ t('openApp.secret.warning') }}
        </div>
        <div class="flex items-center gap-2 rounded-lg border border-border bg-muted p-2">
          <span class="min-w-0 flex-1 truncate font-mono text-xs">{{ secret() }}</span>
          <button
            hlmBtn
            variant="ghost"
            size="icon"
            class="size-8 shrink-0"
            (click)="copy()"
            [attr.aria-label]="t('common.copy')"
            [hlmTooltip]="t('common.copy')"
          >
            <ng-icon name="lucideCopy" />
          </button>
        </div>
      </div>

      <hlm-dialog-footer>
        <button hlmBtn (click)="copy(); visible.set(false)">
          <ng-icon name="lucideCopy" data-icon="inline-start" />
          {{ t('openApp.secret.copyAndClose') }}
        </button>
      </hlm-dialog-footer>
    </hlm-dialog-content>
  </hlm-dialog>
</ng-container>
