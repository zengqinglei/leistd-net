<hlm-dialog [state]="visible() ? 'open' : 'closed'" (stateChanged)="onStateChange($event)">
  <hlm-dialog-content *hlmDialogPortal class="sm:max-w-md">
    <hlm-dialog-header>
      <h3 hlmDialogTitle>{{ header() }}</h3>
    </hlm-dialog-header>

    <div class="flex flex-col gap-3">
      <div class="rounded-lg border border-warning/30 bg-warning/10 px-3 py-2 text-sm text-warning">
        <!--#if (IncludeLocalization)-->
        {{ 'openApp.secret.warning' | transloco }}
        <!--#else-->
        Please copy and store it securely now; the secret will not be shown in plain text again.
        <!--#endif-->
      </div>
      <div class="flex items-center gap-2 rounded border border-border bg-muted p-2">
        <span class="min-w-0 flex-1 truncate font-mono text-xs">{{ secret() }}</span>
        <!--#if (IncludeLocalization)-->
        <button
          hlmBtn
          variant="ghost"
          size="icon"
          class="w-8 h-8 shrink-0"
          (click)="copy()"
          [hlmTooltip]="'common.copy' | transloco"
        >
          <ng-icon name="lucideCopy" />
        </button>
        <!--#else-->
        <button
          hlmBtn
          variant="ghost"
          size="icon"
          class="w-8 h-8 shrink-0"
          (click)="copy()"
          hlmTooltip="Copy"
        >
          <ng-icon name="lucideCopy" />
        </button>
        <!--#endif-->
      </div>
    </div>

    <hlm-dialog-footer>
      <!--#if (IncludeLocalization)-->
      <button hlmBtn (click)="copy(); visible.set(false)">
        <ng-icon name="lucideCopy" data-icon="inline-start" />
        {{ 'openApp.secret.copyAndClose' | transloco }}
      </button>
      <!--#else-->
      <button hlmBtn (click)="copy(); visible.set(false)">
        <ng-icon name="lucideCopy" data-icon="inline-start" />
        Copy and close
      </button>
      <!--#endif-->
    </hlm-dialog-footer>
  </hlm-dialog-content>
</hlm-dialog>
