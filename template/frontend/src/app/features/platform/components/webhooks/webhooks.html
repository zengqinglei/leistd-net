<!--#if (IncludeLocalization)-->
<ng-container *transloco="let t">
<!--#else-->
<ng-container>
<!--#endif-->
  <div class="flex flex-col h-full overflow-hidden">
    <div class="flex flex-1 flex-col gap-6 overflow-y-auto p-4 sm:p-6 *:shrink-0">
      <app-webhook-statistics
        [statistics]="statistics()"
        [preset]="preset()"
        [loading]="statisticsLoading()"
        [loadFailed]="statisticsFailed()"
        [subscriptionName]="selectedSubscriptionName()"
        (presetChange)="setPreset($event)"
        (retry)="reloadStatistics()"
        (showFailed)="showFailedDeliveries()"
      />

      <div class="flex flex-col gap-4">
        <hlm-toggle-group
          type="single"
          size="sm"
          variant="outline"
          class="self-start"
          [nullable]="false"
          [value]="view()"
          [attr.aria-label]="t('webhooks.view.label')"
          data-testid="webhook-view"
          (valueChange)="setView($event)"
        >
          <button hlmToggleGroupItem value="subscriptions">
            {{ t('webhooks.view.subscriptions') }}
          </button>
          <button hlmToggleGroupItem value="deliveries">{{ t('webhooks.view.deliveries') }}</button>
        </hlm-toggle-group>

        <!-- 工具栏写法同开放应用：左组 flex-auto，窄屏按钮 flex-1 平分一行 -->
        <div class="flex flex-wrap items-center justify-between gap-x-4 gap-y-3">
          <div class="flex min-w-0 flex-auto flex-wrap items-center gap-3">
            <hlm-input-group class="w-full sm:w-auto sm:max-w-xs sm:min-w-56 sm:flex-1">
              <hlm-input-group-addon>
                <ng-icon name="lucideSearch" />
              </hlm-input-group-addon>
              <input
                autocomplete="off"
                autocapitalize="off"
                spellcheck="false"
                hlmInputGroupInput
                type="text"
                [attr.aria-label]="
                  view() === 'deliveries'
                    ? t('webhooks.filter.searchDeliveries')
                    : t('webhooks.filter.searchSubscriptions')
                "
                [placeholder]="
                  view() === 'deliveries'
                    ? t('webhooks.filter.searchDeliveries')
                    : t('webhooks.filter.searchSubscriptions')
                "
                [value]="searchQuery()"
                (input)="onSearchQueryChange($any($event.target).value)"
              />
            </hlm-input-group>

            @if (view() === 'deliveries') {
              <app-faceted-filter
                [label]="t('webhooks.filter.subscription')"
                [options]="subscriptionOptions()"
                [value]="selectedSubscriptionId()"
                [searchPlaceholder]="t('webhooks.filter.subscription')"
                [clearLabel]="t('common.clearFilter')"
                [emptyLabel]="t('common.noResults')"
                (valueChange)="onFilterChange('subscriptionId', $event)"
              />
              <app-faceted-filter
                [label]="t('webhooks.filter.status')"
                [options]="deliveryStatusOptions()"
                [value]="selectedDeliveryStatus()"
                [searchPlaceholder]="t('webhooks.filter.status')"
                [clearLabel]="t('common.clearFilter')"
                [emptyLabel]="t('common.noResults')"
                (valueChange)="onFilterChange('status', $event)"
              />
            } @else {
              <app-faceted-filter
                [label]="t('webhooks.filter.status')"
                [options]="subscriptionStatusOptions()"
                [value]="selectedSubscriptionStatus()"
                [searchPlaceholder]="t('webhooks.filter.status')"
                [clearLabel]="t('common.clearFilter')"
                [emptyLabel]="t('common.noResults')"
                (valueChange)="onFilterChange('status', $event)"
              />
            }
            <app-faceted-filter
              [label]="t('webhooks.filter.eventType')"
              [options]="eventTypeOptions()"
              [value]="selectedEventType()"
              [searchPlaceholder]="t('webhooks.filter.eventType')"
              [clearLabel]="t('common.clearFilter')"
              [emptyLabel]="t('common.noResults')"
              (valueChange)="onFilterChange('eventType', $event)"
            />
          </div>

          <div class="ml-auto flex w-full flex-wrap items-center justify-end gap-3 sm:w-auto">
            <button
              hlmBtn
              variant="secondary"
              class="flex-1 sm:flex-none"
              (click)="reload()"
              [hlmTooltip]="t('common.refresh')"
            >
              @if (loading()) {
                <hlm-spinner data-icon="inline-start" />
              } @else {
                <ng-icon name="lucideRefreshCw" data-icon="inline-start" />
              }
              {{ t('common.refresh') }}
            </button>
            @if (canManage() && view() === 'subscriptions') {
              <button
                hlmBtn
                variant="default"
                class="flex-1 sm:flex-none"
                (click)="openCreateDialog()"
              >
                <ng-icon name="lucidePlus" data-icon="inline-start" />
                {{ t('webhooks.action.create') }}
              </button>
            }
          </div>
        </div>
      </div>

      @if (view() === 'deliveries') {
        <app-webhook-delivery-table
          [deliveries]="deliveries()"
          [totalCount]="totalRecords()"
          [pagination]="pagination()"
          [loading]="loading()"
          [filtered]="hasActiveFilters()"
          [loadError]="loadError()"
          [canManage]="canManage()"
          [selectedId]="deliveryId()"
          [retryingId]="retryingDeliveryId()"
          (reload)="reload()"
          (paginationChange)="onPaginationChange($event)"
          (open)="openDelivery($event)"
          (retry)="retryDelivery($event)"
        />
      } @else {
        <app-webhook-subscription-table
          [subscriptions]="subscriptions()"
          [totalCount]="totalRecords()"
          [pagination]="pagination()"
          [loading]="loading()"
          [filtered]="hasActiveFilters()"
          [loadError]="loadError()"
          [canManage]="canManage()"
          [now]="now()"
          [busyId]="busySubscriptionId()"
          (retry)="reload()"
          (paginationChange)="onPaginationChange($event)"
          (edit)="openEditDialog($event)"
          (sendTest)="sendTestEvent($event)"
          (viewDeliveries)="viewDeliveries($event)"
          (rotateSecret)="rotateSecret($event)"
          (enable)="openEnableDialog($event)"
          (disable)="disableSubscription($event)"
          (delete)="deleteSubscription($event)"
        />
      }
    </div>
  </div>

  <app-webhook-delivery-sheet
    [open]="deliveryId() !== null"
    [delivery]="delivery()"
    [loading]="deliveryLoading()"
    [loadError]="deliveryError()"
    [canManage]="canManage()"
    [retrying]="retryingDeliveryId() !== null"
    (closed)="closeDelivery()"
    (reload)="reloadDelivery()"
    (retry)="retryDelivery($event)"
  />

  @if (canManage()) {
    <app-webhook-subscription-dialog
      [(visible)]="editDialogVisible"
      [editing]="editingSubscriptionId() !== null"
      [loading]="editDialogLoading()"
      [loadError]="editDialogError()"
      (retry)="retrySubscriptionDetail()"
      [subscription]="selectedSubscription()"
      [eventTypes]="eventTypes()"
      [eventTypesLoading]="eventTypesLoading()"
      [eventTypesError]="eventTypesError()"
      (reloadEventTypes)="loadEventTypes()"
      [saveAction]="handleSave"
    />

    <app-webhook-secret-dialog
      [visible]="secretDialogVisible()"
      (visibleChange)="onSecretDialogVisibleChange($event)"
      [secret]="secretValue()"
      [kind]="secretKind()"
      [subscriptionName]="secretSubscriptionName()"
    />

    <app-webhook-enable-dialog
      [(visible)]="enableDialogVisible"
      [subscriptionName]="enablingSubscription()?.name ?? ''"
      (confirmed)="enableSubscription($event)"
    />
  }
</ng-container>
