<!--#if (IncludeLocalization)-->
<ng-container *transloco="let t">
<!--#else-->
<ng-container>
<!--#endif-->
  <main class="flex min-h-screen items-center justify-center bg-background px-4">
    <section class="text-center">
      @if (error(); as error) {
        <h1 class="mb-3 text-2xl font-semibold text-destructive">
          {{ t('account.login.loginFailed') }}
        </h1>
        <p class="text-muted-foreground">{{ 'key' in error ? t(error.key) : error.text }}</p>
      } @else {
        <hlm-spinner
          class="text-4xl"
          [attr.aria-label]="t('account.externalCallback.processingAria')"
        />
        <h1 class="mt-4 text-2xl font-semibold text-foreground">
          {{ t('account.externalCallback.processing') }}
        </h1>
      }
    </section>
  </main>
</ng-container>
