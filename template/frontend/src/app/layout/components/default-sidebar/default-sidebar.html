<hlm-sidebar collapsible="icon">
  <div hlmSidebarHeader>
    <div class="flex items-center gap-3 px-2 py-1 overflow-hidden">
      <app-logo size="normal" />
      <span
        class="font-bold text-lg tracking-tight text-primary whitespace-nowrap group-data-[collapsible=icon]:hidden"
      >
        <!--#if (IncludeLocalization)-->
        {{ 'layout.sidebar.appTitle' | transloco }}
        <!--#else-->
        Template Project
        <!--#endif-->
      </span>
    </div>
  </div>

  <div hlmSidebarContent>
    @for (group of menuGroups(); track $index) {
      <div hlmSidebarGroup>
        @if (group.label) {
          <div hlmSidebarGroupLabel>{{ group.label }}</div>
        }
        <div hlmSidebarGroupContent>
          <ul hlmSidebarMenu>
            @for (item of group.items; track item.route) {
              <li hlmSidebarMenuItem>
                <a
                  hlmSidebarMenuButton
                  [routerLink]="item.route"
                  [isActive]="isItemActive(item)"
                  [tooltip]="item.label"
                >
                  <ng-icon [name]="item.icon" />
                  <span>{{ item.label }}</span>
                </a>
              </li>
            }
          </ul>
        </div>
      </div>
    }
  </div>
</hlm-sidebar>
