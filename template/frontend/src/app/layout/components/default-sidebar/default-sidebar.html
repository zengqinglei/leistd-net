<hlm-sidebar collapsible="icon">
  <div hlmSidebarHeader>
    <ul hlmSidebarMenu>
      <li hlmSidebarMenuItem>
        <!-- Spartan 品牌头：用 menu-button 基元（size=lg），折叠为 icon 时自动收成居中的方形图标，避免自绘容器溢出裁剪。 -->
        <a hlmSidebarMenuButton size="lg" [routerLink]="layoutService.homeRoute()">
          <app-logo size="normal" />
          <div class="grid flex-1 text-left leading-tight group-data-[collapsible=icon]:hidden">
            <!--#if (IncludeLocalization)-->
            <span class="truncate text-sm font-medium">{{
              'layout.sidebar.appTitle' | transloco
            }}</span>
            <span class="truncate text-xs text-muted-foreground">{{
              'layout.sidebar.appSubtitle' | transloco
            }}</span>
            <!--#else-->
            <span class="truncate text-sm font-medium">Template Project</span>
            <span class="truncate text-xs text-muted-foreground">Admin Platform</span>
            <!--#endif-->
          </div>
        </a>
      </li>
    </ul>
  </div>

  <div hlmSidebarContent>
    @for (group of menuGroups(); track $index) {
      <div hlmSidebarGroup>
        @if (group.label) {
          <div hlmSidebarGroupLabel>{{ group.label }}</div>
        }
        <div hlmSidebarGroupContent>
          <ul hlmSidebarMenu>
            @for (item of group.items; track item.route) {
              <li hlmSidebarMenuItem>
                <a
                  hlmSidebarMenuButton
                  class="data-active:bg-primary/10! data-active:text-primary! data-active:font-semibold!"
                  [routerLink]="item.route"
                  [isActive]="isItemActive(item)"
                  [tooltip]="item.label"
                >
                  <ng-icon [name]="item.icon" />
                  <span>{{ item.label }}</span>
                </a>
              </li>
            }
          </ul>
        </div>
      </div>
    }
  </div>

  <!-- Spartan canonical：侧栏底部（nav-user 模式）——仅用户菜单，折叠时收成图标。 -->
  <!--#if (IncludeIdentity)-->
  <div hlmSidebarFooter>
    <app-user-menu />
  </div>
  <!--#endif-->
</hlm-sidebar>
