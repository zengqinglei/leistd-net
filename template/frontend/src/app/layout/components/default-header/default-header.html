<!-- Header -->
<header
  class="h-14 shrink-0 flex items-center justify-between px-4 md:px-6 bg-background/95 backdrop-blur border-b border-border z-30 sticky top-0"
>
  <!-- 折叠按钮 + 分隔线 + 路由面包屑 -->
  <div class="flex items-center gap-2 flex-1 min-w-0">
    <!--#if (IncludeLocalization)-->
    <button
      hlmSidebarTrigger
      size="icon"
      position="bottom"
      [attr.aria-label]="'common.toggleSidebar' | transloco"
      [hlmTooltip]="sidebarTip"
    ></button>
    <!--#else-->
    <button
      hlmSidebarTrigger
      size="icon"
      position="bottom"
      aria-label="Toggle sidebar"
      [hlmTooltip]="sidebarTip"
    ></button>
    <!--#endif-->
    <ng-template #sidebarTip>
      <span class="flex items-center gap-2">
        <!--#if (IncludeLocalization)-->
        {{ 'common.toggleSidebar' | transloco }}
        <!--#else-->
        Toggle sidebar
        <!--#endif-->
        <kbd hlmKbdGroup><kbd hlmKbd>⌘ B</kbd></kbd>
      </span>
    </ng-template>

    <hlm-separator orientation="vertical" class="me-2 !h-6 !self-center" />

    <nav hlmBreadcrumb class="overflow-hidden">
      <ol hlmBreadcrumbList>
        <li hlmBreadcrumbItem class="hidden sm:inline-flex">
          <!--#if (IncludeLocalization)-->
          <a hlmBreadcrumbLink [link]="layoutService.homeRoute()">{{ homeLabel() | transloco }}</a>
          <!--#else-->
          <a hlmBreadcrumbLink [link]="layoutService.homeRoute()">{{ homeLabel() }}</a>
          <!--#endif-->
        </li>
        <li hlmBreadcrumbSeparator class="hidden sm:inline-flex"></li>
        <li hlmBreadcrumbItem class="min-w-0">
          <span hlmBreadcrumbPage class="truncate">{{ layoutService.title() }}</span>
        </li>
      </ol>
    </nav>
  </div>

  <!-- Right Actions -->
  <div class="flex items-center gap-2 md:gap-4">
    <!-- Theme Toggle -->
    <app-theme-mode-toggle />

    <!-- Notifications -->
    <!--#if (IncludeNotifications)-->
    <app-notifications />
    <!--#else-->
    <button hlmBtn variant="ghost" size="icon" aria-label="Notifications">
      <ng-icon name="lucideBell" />
    </button>
    <!--#endif-->
    <!--#if (IncludeLocalization)-->
    <!-- Language Switcher: 铃铛右侧 -->
    <app-language-switcher />
    <!--#endif-->
  </div>
</header>
