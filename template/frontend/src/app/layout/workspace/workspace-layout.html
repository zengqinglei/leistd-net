<!-- 工作空间布局：顶栏导航 + 限宽内容区。面向业务用户，内容优先，不占一整列给导航。 -->
<div class="flex h-svh flex-col" data-layout="workspace">
  <app-default-header layout="topbar" />
  <app-navigation-progress placement="content" />
  <!--#if (IncludeRealTime)-->
  <!-- 与内容区同宽，提示条和页面左右留白对齐 -->
  <app-realtime-status class="mx-auto w-full max-w-7xl" />
  <!--#endif-->
  <!-- 顶栏不放面包屑；嵌套页（设了上级）在正文上方给出，与正文同宽，在滚动区外 -->
  @if (layoutService.trail().length) {
    <app-page-breadcrumb class="mx-auto w-full max-w-7xl px-4 pt-3 sm:px-6" />
  }

  <main class="relative flex-1 overflow-auto motion-safe:scroll-smooth">
    <div class="mx-auto h-full w-full max-w-7xl">
      <router-outlet />
    </div>
  </main>

  <app-command-palette />
</div>
