<!-- 应用主布局容器：hlmSidebarWrapper 包裹侧边栏与主内容区（inset） -->
<div hlmSidebarWrapper data-layout="default">
  <!-- 侧边栏（桌面折叠为图标轨道；移动端由 HlmSidebarService 自动渲染为 sheet） -->
  <app-default-sidebar />

  <!-- 主内容区（inset）：Header + 内容 + Footer -->
  <main hlmSidebarInset class="flex flex-col h-screen overflow-hidden bg-background">
    <app-default-header />

    <div class="flex-1 overflow-auto custom-scrollbar scroll-smooth">
      <router-outlet></router-outlet>
    </div>

    <app-default-footer></app-default-footer>
  </main>
</div>
