<!-- 应用主布局容器：hlmSidebarWrapper 包裹侧边栏与主内容区（inset 卡片）。 -->
<div hlmSidebarWrapper data-layout="default" class="h-svh">
  <!-- 侧边栏（inset 变体：内容区浮为圆角卡片；桌面折叠为图标轨，移动端渲染为 sheet） -->
  <app-default-sidebar />

  <!-- 主内容区（inset）：Header + 内容；inset 变体自带 m-2 / 圆角 / 阴影。 -->
  <main hlmSidebarInset class="overflow-hidden">
    <app-default-header />

    <div class="flex-1 overflow-auto scroll-smooth">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
