# 只准备运行环境，验证步骤全部在 scripts/verify.ps1（与本地完整回归同一入口）；
# 默认分支的 push 验证通过后由 publish-images 构建并推送 api、migrator 两个镜像。
# 设为合并必过的方法见 docs/standards/testing.md §1.1。
#
# Runner 前提：Docker executor 且 privileged = true（Docker-in-Docker）。集成测试经 Testcontainers
# 在 dind 服务里启动 PostgreSQL；连接方式按 Testcontainers 官方 GitLab CI 配置：
# DOCKER_HOST 指向 dind 服务，关闭 TLS（DOCKER_TLS_CERTDIR 置空，daemon 带 --tls=false 避免启动延迟）。
stages:
  - verify
  # 镜像发布在 verify 阶段全部作业（verify 与适用的依赖审计）成功之后
  - publish

verify:
  stage: verify
  # .NET SDK 镜像自带 PowerShell 与 curl；Python 与 Node.js 在 before_script 安装
  image: mcr.microsoft.com/dotnet/sdk:10.0
  services:
    - name: docker:dind
      alias: docker
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
    VERIFY_INSTALL_BROWSER_DEPS: "1"
    # GitLab 只缓存项目目录内的路径：把 NuGet 全局包与 npm 缓存放进来
    NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"
#if (SpaFrontend)
    npm_config_cache: "$CI_PROJECT_DIR/.npm"
#endif
  timeout: 1h
  # 缓存只存下载内容，不存构建输出；合并请求只读，默认分支读写并刷新
  cache:
    - key:
        prefix: nuget
        files:
          - backend/Directory.Packages.props
      paths:
        - .nuget/packages
      policy: $CACHE_POLICY
#if (SpaFrontend)
    - key:
        prefix: npm
        files:
          - frontend/package-lock.json
      paths:
        - .npm
      policy: $CACHE_POLICY
#endif
  rules:
    # 定时流水线只做依赖审计
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      variables:
        CACHE_POLICY: pull
    - if: $CI_PIPELINE_SOURCE == "web"
      variables:
        CACHE_POLICY: pull
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      variables:
        CACHE_POLICY: pull-push
  before_script:
    # Ubuntu 源改走 HTTPS：部分 Runner 的 IPv6 出口到 archive.ubuntu.com:80 不通，HTTPS 不受影响；包本身仍按签名校验。
    # 之后的 apt 调用（NodeSource、Playwright --with-deps）都读这份源
    - sed -i 's|http://|https://|g' /etc/apt/sources.list.d/ubuntu.sources
    - apt-get update
    - apt-get install -y --no-install-recommends git python3
#if (SpaFrontend)
    - curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
    - apt-get install -y --no-install-recommends nodejs
#endif
  script:
    - |
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ] && [ "$CI_MERGE_REQUEST_EVENT_TYPE" = "detached" ] && [ -n "$CI_MERGE_REQUEST_DIFF_BASE_SHA" ]; then
        pwsh -NoProfile -File scripts/verify.ps1 -ChangedBase "$CI_MERGE_REQUEST_DIFF_BASE_SHA"
      else
        pwsh -NoProfile -File scripts/verify.ps1
      fi
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: test-reports/*.xml
#if (LocalIdentity)
    # Playwright 报告、trace 与 API 日志用于定位失败和 flaky 用例
    paths:
      - frontend/playwright-report/
      - frontend/test-results/
#endif
#if (SpaFrontend)

# 前端生产依赖审计：不在 scripts/verify.ps1 里，只在锁文件变化、定时（需在项目里建 Schedule）和手动时运行。
# 有修复版本的 high/critical 阻断，暂无修复版本的输出警告。
frontend-audit:
  stage: verify
  image: node:24
  timeout: 10m
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - frontend/package-lock.json
  script:
    - cd frontend
    - node scripts/audit-dependencies.mjs
#endif

# 后端 NuGet 依赖审计：构建里公告只告警（backend/Directory.Build.props），这里按 high/critical 把关。
# 定时（需在项目里建 Schedule）、手动，以及包版本、框架版本（Directory.Build.props）或项目文件变化时运行。
backend-audit:
  stage: verify
  image: mcr.microsoft.com/dotnet/sdk:10.0
  timeout: 15m
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - backend/Directory.Packages.props
        - backend/Directory.Build.props
        - backend/**/*.csproj
  script:
    - pwsh -NoProfile -File scripts/audit-backend-dependencies.ps1

# 镜像发布：只在默认分支的 push 流水线上运行，阶段屏障保证同一提交的 verify 与依赖审计都已成功；
# 合并请求、定时与手动运行不发布。前提是项目已启用 Container Registry，Runner 要求同 verify（privileged）。
# 标签为提交 SHA，部署按日志与 dotenv 报告里的 digest 晋级。
publish-images:
  stage: publish
  image: docker:cli
  services:
    - name: docker:dind
      alias: docker
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
  timeout: 30m
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - |
      set -eu
      version_arg=""
      if [ -f VERSION ]; then version_arg="APP_VERSION=$(tr -d '[:space:]' < VERSION)"; fi
      : > images.env
      for target in api migrator; do
        image="$CI_REGISTRY_IMAGE/$target:$CI_COMMIT_SHA"
        docker build --target "$target" --build-arg "APP_REVISION=$CI_COMMIT_SHA" ${version_arg:+--build-arg "$version_arg"} -t "$image" .
        docker push "$image"
        digest=$(docker buildx imagetools inspect "$image" --format '{{.Manifest.Digest}}')
        echo "$image@$digest"
        echo "$(echo "$target" | tr '[:lower:]' '[:upper:]')_IMAGE_DIGEST=$digest" >> images.env
      done
  artifacts:
    reports:
      dotenv: images.env
